<div id="app">
  <header id="hud">
    <div class="hud-row">
      <div id="roomName">Ojuju Calabar</div>
      <button class="ibtn" id="bJournal" aria-label="Journal">
        <svg viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H18v16H6.5A1.5 1.5 0 0 0 5 20.5z"/><path d="M5 20.5A1.5 1.5 0 0 0 6.5 22H18"/><path d="M9 8h6M9 12h4"/></svg>
      </button>
      <button class="ibtn" id="bHint" aria-label="Hint">
        <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
      </button>
      <button class="ibtn" id="bSound" aria-label="Sound">
        <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path id="sndWaves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      </button>
      <button class="ibtn" id="bMenu" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
    <div id="dreadRow" aria-label="Dread meter">
      <svg viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <div id="dread"><div id="dreadFill"></div></div>
      <div id="lives" role="img" aria-label="5 of 5 lanterns left"></div>
    </div>
  </header>

  <main id="stage">
    <canvas id="gl" aria-label="First-person view of the room"></canvas>
    <div id="reticle"></div>
    <div id="aim" aria-live="off"></div>
    <div id="flash"></div>
    <div id="hurt"></div>
    <div id="voice" aria-live="polite"></div>
    <div id="peek" aria-hidden="true"><i></i></div>
    <div id="quiet" aria-live="assertive"><svg viewBox="0 0 48 48" aria-hidden="true"><circle class="qr" cx="24" cy="24" r="21"/><path d="M17 30c0-6 1-9 4-12a7 7 0 0 1 12 5c0 4-4 5-4 9a4 4 0 0 1-7 2M22 23a3 3 0 0 1 6 0"/></svg><b>Something is calling your name</b><span>Don’t move. Don’t answer.</span></div>
    <div id="caption" aria-live="polite"></div>
    <div id="joyZone" aria-label="Walk: drag on the left side"></div>
    <div id="joy" aria-hidden="true"><div id="joyKnob"></div></div>
    <button id="useBtn" type="button" aria-label="Use what is under the dot"><svg viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11M11 10V4a1.5 1.5 0 0 1 3 0v6M14 10V5.5a1.5 1.5 0 0 1 3 0V12M17 9.5a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.6-2.8L3.6 16a1.6 1.6 0 0 1 2.5-2L8 16"/></svg></button>
    <div id="scare" aria-hidden="true"></div>
    <div id="card"></div>
    <div id="saved" aria-live="polite">Progress saved</div>
  </main>

  <footer id="bag" aria-label="Items you carry"></footer>

  <div id="rotate" aria-live="polite"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="22" y="8" width="20" height="36" rx="3"/><path d="M14 50a22 22 0 0 0 36 0M46 46l4 4 4-5"/></svg><p>Best played sideways</p><span class="rsub">Turn your phone for a wider view and two-thumb controls. You can still play upright.</span><div class="rbtns"><button class="btn primary" id="rotSide">Turn sideways</button><button class="btn" id="rotUp">Play upright</button></div><button class="rlink" id="rotAlways">Don’t ask again</button></div>
  <div id="modal" role="dialog" aria-modal="true"><button id="modalX" type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="panel" id="panel"></div></div>

  <section id="title"></section>

  <section id="cut" aria-live="polite"><button class="cskip" type="button">Skip</button><div class="ck"></div><div class="ct"></div><div class="cgo">Tap to continue</div></section>

  <section id="splash" aria-label="Muniac Studios"><div class="spglow"></div><div class="spwrap"><div class="splogo"><div class="sp">Muniac</div><i class="spline"></i><div class="spsub" aria-hidden="true"><b>S</b><b>T</b><b>U</b><b>D</b><b>I</b><b>O</b><b>S</b></div></div></div><div class="spgrain"></div></section>
<script>/* start the opening at once, before the rest of the game has even downloaded */(function(){var sp=document.getElementById('splash'),nm=sp&&sp.querySelector('.sp');if(!nm)return;nm.dataset.split='1';nm.innerHTML=nm.textContent.split('').map(function(ch,k){return ch===' '?' ':'<span style="--d:'+(.35+Math.random()*.9+k*.015).toFixed(2)+'s">'+ch+'</span>';}).join('');sp.classList.add('play');window.__splashAt=Date.now();})();</script>
  <section id="loading"><div class="lart"></div><div class="lstudio"><span class="ls1">Muniac Studios</span><span class="ls2">presents</span></div><div class="lbody"><div class="lname">Ojuju Calabar</div><p class="lq"></p><div class="lbar"><i></i></div><button class="btn primary" type="button">Tap to enter</button></div></section>
</div>
