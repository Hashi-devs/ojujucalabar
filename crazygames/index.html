/* ================= OJUJU WALKS THE HOUSE, AND FIVE LANTERNS ================= */
/* Between the set pieces he is never far: footsteps in the passage that pass the door, or stop.
   Sometimes he steps in and looks for you, and you must keep still until he goes.
   A glimpse of him at the far end of the room. A chair turned round while your back was turned.
   Being caught puts out one of your five lanterns. A cowrie relights one. When the last goes out,
   the house takes you back to the start of the chapter. */

const LIVES_MAX = 5;
const CHAPTERS = [
  { start: 0, name: 'Downstairs' },
  { start: 3, name: 'The Boys’ Quarters and Papa’s Office' },
  { start: 5, name: 'Upstairs' }
];
const chapterOf = room => { let c = CHAPTERS[0]; for (const ch of CHAPTERS) if (room >= ch.start) c = ch; return c; };

/* ---------- the lanterns in the corner ---------- */
const LANTERN_SVG = '<svg viewBox="0 0 16 22" aria-hidden="true"><path class="lh" d="M5 4h6M8 1v3"/><path class="lb" d="M4 6h8l1 3v8l-1 2H4l-1-2V9z"/><path class="lf" d="M8 9c-2 2.4-1.4 5 0 6c1.4-1 2-3.6 0-6z"/></svg>';
function renderLives(lostIdx = -1, gainIdx = -1) {
  const el = $('#lives'); if (!el) return;
  const n = G.lives == null ? LIVES_MAX : G.lives;
  el.innerHTML = Array.from({ length: LIVES_MAX }, (_, i) => `<i class="lt${i < n ? ' on' : ''}${i === lostIdx ? ' out' : ''}${i === gainIdx ? ' relit' : ''}">${LANTERN_SVG}</i>`).join('');
  el.setAttribute('aria-label', n + ' of ' + LIVES_MAX + ' lanterns left');
}

/* cause: 'fear' | 'chase' | 'roof' | 'visit' */
function loseLife(cause) {
  if (G.mode === 'gentle') return;
  chaseReset(); presenceStop();
  G.over = false;
  const before = G.lives == null ? LIVES_MAX : G.lives;
  G.lives = Math.max(0, before - 1);
  save(false);           // keep the lost lantern even if the game is closed now
  G.over = true;
  renderLives(G.lives); Snd.lanternOut(); vibe([60, 60, 120]);
  const lead = {
    fear: 'Your fear fills you up. Cold hands close round your ankles, and the light goes out.',
    chase: 'Long fingers close on your shoulder. His breath puts out your lantern.',
    roof: 'Long fingers close round your ankle, and the zinc slides away under you.',
    visit: 'You moved. He heard you. He crosses the room in three long steps.',
    scare: 'His face fills the dark, and your last lantern goes out.'
  }[cause] || 'The light goes out.';
  setTimeout(() => {
    if (G.lives > 0) {
      const left = G.lives === 1 ? 'One lantern left.' : G.lives + ' lanterns left.';
      openModal(`<h2 class="smear">A lantern goes out</h2><p class="lead">${lead}</p>
        <div class="lanterns-big">${Array.from({ length: LIVES_MAX }, (_, i) => `<i class="${i < G.lives ? 'on' : ''}">${LANTERN_SVG}</i>`).join('')}</div>
        <p>${left} You wake at the door of this room, with everything you had found. Each cowrie you find relights a lantern.</p>
        <div class="col"><button class="btn primary" data-retry>${cause === 'roof' ? 'Run again' : 'Wake up again'}</button></div>`, { dismiss: false, cls: 'blood' });
      panel.onclick = e => { if (e.target.closest('[data-retry]')) { closeModal(); restoreRoom(false); } };
    } else {
      const ch = chapterOf(G.room);
      // once per chapter, where ads can play: a short video relights one lantern and you stay in this room
      const canAd = adsCanReward() && !(G.chap && G.chap.adUsed);
      openModal(`<h2 class="smear">The last lantern goes out</h2><p class="lead">${lead}</p>
        <p>The house takes you back to the start of <b>${ch.name}</b>. Everything you found after that is gone. Your five lanterns are lit again.</p>
        ${canAd ? '<p class="adnote">Or watch a short ad to relight one lantern and wake at the door of this room instead. You can do this once in each chapter.</p>' : ''}
        <div class="col">${canAd ? `<button class="btn" data-ad>${AD_ICON} Watch an ad to relight a lantern</button>` : ''}<button class="btn" data-retry>Begin the chapter again</button></div>
        <p class="msg" id="adMsg" aria-live="polite"></p>`, { dismiss: false, cls: 'blood' });
      panel.onclick = e => {
        if (e.target.closest('[data-retry]')) { closeModal(); restartChapter(); }
        else if (e.target.closest('[data-ad]')) {
          const b = e.target.closest('[data-ad]'); b.disabled = true;
          rewardedAd(() => {
            if (G.chap) G.chap.adUsed = true;
            closeModal(); G.lives = 1; renderLives(-1, 0); Snd.relight();
            restoreRoom(false);
            setTimeout(() => say('One lantern flickers back to life. You wake at the door of the room, with everything you had found.', 5200), 900);
          }, () => { b.remove(); const m = $('#adMsg'); if (m) m.textContent = 'No ad is available right now. Try again another time.'; });
        }
      };
    }
  }, cause === 'fear' ? 300 : 1100);
}
/* a scare from him burns one lantern down without sending you back to the door; the last one is a full catch */
function burnLantern(msg) {
  if (G.mode === 'gentle' || G.over) return;
  const n = G.lives == null ? LIVES_MAX : G.lives;
  if (n <= 1) { G.over = true; setTimeout(() => loseLife('scare'), 500); return; }
  G.lives = n - 1; renderLives(G.lives); Snd.lanternOut(); vibe([40, 40, 90]);
  setTimeout(() => say((msg ? msg + ' ' : '') + (G.lives === 1 ? 'Only one lantern is left burning.' : 'One of your lanterns gutters out. ' + G.lives + ' left.'), 5200), 1600);
  queueSave();
}
function restartChapter() {
  const c = G.chap;
  G.lives = LIVES_MAX; G.dropped = null; G.over = false; G.busy = false;
  if (c && typeof c.room === 'number') {
    G.inv = c.inv.slice(); G.journal = c.journal.map(j => ({ ...j })); G.pages = c.pages.slice(); G.cowries = c.cowries.slice();
    withLoading(() => enterRoom(c.room), 900);
  } else restoreRoom(true);  // an older save without a chapter mark: start this room over
  renderLives();
}
function relightLantern() {
  if (G.mode === 'gentle' || G.lives == null || G.lives >= LIVES_MAX) return false;
  G.lives++; renderLives(-1, G.lives - 1); Snd.relight();
  return true;
}

/* ---------- presence ---------- */
const PRES = { on: false, t: 0, node: null };
const MOVABLE = { foyer: 'chair', nursery: 'horse', cellar: 'skull', study: 'sarm', chapel: 'lectern', attic: 'rchair' };
function presenceStop() {
  clearTimeout(PRES.t);
  if (PRES.node) { removeNode(PRES.node); PRES.node = null; }
  if (PRES.on) { PRES.on = false; setQuietUi(false); }
  if (PRES.hid && typeof CH !== 'undefined' && CH.hidden && !CH.on) unhide();   // never leave someone stuck in a hiding place
  PRES.hid = false;
  resetQuietText();
}
function schedulePresence(first) {
  clearTimeout(PRES.t);
  if (G.mode === 'gentle') return;
  PRES.t = setTimeout(runPresence, (first ? rnd(22000, 38000) : rnd(38000, 70000)));
}
function presenceOk() {
  const k = roomKey();
  return Rm && G.started && G.mode !== 'gentle' && !G.noAmbient && !G.noPresence && canAct() && !document.hidden && !CH.on && !CH.hidden && !QUIET.on && !PRES.on && !G.f.left && k !== 'roof';
}
function runPresence() {
  if (!presenceOk()) { PRES.t = setTimeout(runPresence, 6000); return; }
  const f = G.f, r = Math.random();
  const visits = f.visits || 0, canVisit = visits < 3 && G.room > 0;
  if (canVisit && r < .4) visit();
  else if (r < .62) footstepsPass();
  else if (r < .82 && glimpse()) { /* done */ }
  else if (!f.movedDone && MOVABLE[roomKey()]) moveBehind();
  else footstepsPass();
  schedulePresence(false);
}

/* where the passage is: the door you came in by */
function entryPoint() {
  const sp = (Rm && Rm.api && Rm.api.spawn) || { x: 0, z: 2 };
  return [sp.x || 0, Math.min(2.65, (sp.z || 2) + .65)];
}
function panTo(x, z) {
  const c = G.cam, dx = x - c.pos[0], dz = z - c.pos[2], l = Math.hypot(dx, dz) || 1;
  const rx = Math.cos(c.yaw), rz = Math.sin(c.yaw);
  return Math.max(-1, Math.min(1, (dx * rx + dz * rz) / l));
}

function footstepsPass() {
  const [ex, ez] = entryPoint(), side = Math.random() < .5 ? -1 : 1, stop = Math.random() < .5;
  say(pick(['Footsteps in the passage outside. Slow. Heavy.', 'Bare feet on the terrazzo outside the door, coming closer, and the dry whisper of raffia.', 'Something walks the passage. Each step is a long time after the last.']), 4200);
  const n = 9;
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      if (!Rm) return;
      const k = i / (n - 1), near = 1 - Math.abs(k - .5) * 2; // loudest at the door
      const pan = panTo(ex + side * (2.5 - k * 5), ez + .6);
      Snd.stompAt(.12 + near * .5, pan);
      if (i === Math.floor(n / 2)) { Snd.breath(pan); if (stop) { say('They stop outside the door. Something breathes in, slowly. Then they go on.', 4200); Snd.heartbeat(); } }
    }, i * 720 + (stop && i > n / 2 ? 2200 : 0));
  }
}

function visit() {
  const f = G.f; f.visits = (f.visits || 0) + 1;
  const [ex, ez] = entryPoint(), c = G.cam;
  PRES.on = true; PRES.hid = false;
  warnRoll();   // the clicker, some of the time
  const nh = nearestHide();
  say(nh && nh.d < 4.2 ? 'Footsteps in the passage, coming straight for this door. ' + nh.h.hint + ', or keep still.' : 'Footsteps in the passage, coming straight for this door.', 3600);
  for (let i = 0; i < 5; i++) setTimeout(() => PRES.on && Snd.stompAt(.2 + i * .14, panTo(ex, ez)), i * 650);
  setTimeout(() => {
    if (!PRES.on || !Rm) return;
    Snd.rattle(panTo(ex, ez)); Snd.creakAt(panTo(ex, ez));
    const q = $('#quiet');
    if (q) { $('b', q).textContent = 'He is in the room'; $('span', q).textContent = 'Keep still. Don’t touch anything.'; }
    say(PRES.hid ? 'The door handle turns. He is in the room. Stay hidden.' : 'The door handle turns. He is coming in. Keep still. Touch nothing.', 4200); vibe([30, 60, 30]);
    const x0 = c.pos[0], z0 = c.pos[2];
    const n = figure('silas', ex, ez); n.alpha = 0; PRES.node = n;
    // he walks a little way in, looks about, and goes back out
    const ins = [ex * .6, ez - 1.3];
    const dur = 8.5;
    let t = 0, stepT = 0, failed = false;
    PRES.tapped = false;
    fx.push(dt => {
      if (!PRES.on || PRES.node !== n || !Rm) { if (PRES.node === n) { removeNode(n); PRES.node = null; } return false; }
      t += dt;
      if (!failed) {
        const k = t < 2.2 ? t / 2.2 : t < 5.6 ? 1 : Math.max(0, 1 - (t - 5.6) / 2.2);
        n.pos[0] = ex + (ins[0] - ex) * k; n.pos[2] = ez + (ins[1] - ez) * k;
        n.alpha = Math.min(.92, t * 1.4) * (t > dur - .8 ? Math.max(0, (dur - t) / .8) : 1);
        n.pos[1] = SPR.silas[2] + Math.abs(Math.sin(t * 4)) * .04;
        stepT -= dt; if ((t < 2.2 || t > 5.6) && stepT <= 0) { stepT = .7; Snd.stompAt(.5, panTo(n.pos[0], n.pos[2])); }
        if (t > 2.4 && t - dt <= 2.4) { Snd.breath(panTo(n.pos[0], n.pos[2])); }
        if (t > 3.8 && t - dt <= 3.8) Snd.heartbeat();
        setQuietUi(true, Math.max(0, 1 - t / dur));
        const moved = !PRES.hid && Math.hypot(c.pos[0] - x0, c.pos[2] - z0) > .18;   // hidden = safe
        if ((moved || (PRES.tapped && !PRES.hid)) && t > .4) {
          failed = true; Snd.shriek();
        }
        if (t >= dur) {
          removeNode(n); PRES.node = null; PRES.on = false; setQuietUi(false); resetQuietText();
          say('The door closes behind him. The footsteps go away down the passage. You breathe out.', 4200); addDread(PRES.hid ? -10 : -6); queueSave();
          if (PRES.hid) { PRES.hid = false; setTimeout(() => { if (CH.hidden && !CH.on) unhide(); }, 1400); }
          return false;
        }
        return true;
      }
      // he comes for you
      const dx = c.pos[0] - n.pos[0], dz = c.pos[2] - n.pos[2], d = Math.hypot(dx, dz) || 1;
      const m = Math.min(d, 5.5 * dt); n.pos[0] += dx / d * m; n.pos[2] += dz / d * m; n.alpha = .95;
      if (d < .7) {
        removeNode(n); PRES.node = null; PRES.on = false; setQuietUi(false); resetQuietText();
        overlay('silas'); loseLife('visit');
        return false;
      }
      return true;
    });
  }, 4200);   // time enough to reach a hiding place
}
function resetQuietText() {
  const q = $('#quiet');
  if (q) { $('b', q).textContent = 'Something is calling your name'; $('span', q).textContent = 'Don’t move. Don’t answer.'; }
}

/* he is there at the far end of the room, and then he is not */
function glimpse() {
  const c = G.cam;
  for (const nx of [0, -.45, .45]) {
    const h = R3.pick(Rm.sc, c, nx, -.1);
    const dist = h ? h.t : 6;
    if (dist < 2.8) continue;
    const yaw = c.yaw + Math.atan(nx * Math.tan(.6)), d = Math.min(dist - .45, 4.5);
    const x = Math.max(-2.6, Math.min(2.6, c.pos[0] + Math.sin(yaw) * d)), z = Math.max(-2.6, Math.min(2.6, c.pos[2] - Math.cos(yaw) * d)); // stay inside the room
    const n = figure('silas', x, z); n.alpha = 0; PRES.node = n;
    let t = 0;
    fx.push(dt => {
      if (PRES.node !== n || !Rm) return false;
      t += dt; n.alpha = t < .15 ? t / .15 * .8 : t < .75 ? .8 : Math.max(0, .8 - (t - .75) * 4);
      if (t > 1) { removeNode(n); PRES.node = null; return false; }
      return true;
    });
    Snd.heartbeat(); setTimeout(() => Snd.heartbeat(), 420); vibe(30); addDread(6);
    setTimeout(() => say(pick(['Was that…?', 'Nothing there now.', 'You blink. Only the dark.']), 2600), 1300);
    return true;
  }
  return false;
}

/* something is moved while you are not looking */
function findNode(id) {
  const walk = n => { if (n.id === id) return n; for (const k of n.kids) { const r = walk(k); if (r) return r; } return null; };
  return Rm ? walk(Rm.sc.root) : null;
}
function moveBehind() {
  const id = MOVABLE[roomKey()], n = findNode(id); if (!n) return;
  const tk = G.token; let stage = 0;
  const seen = () => { const w = n.world, p = R3.project(G.cam, [w[12], w[13] + .4, w[14]]); return p && Math.abs(p.x) < .7 && Math.abs(p.y) < .9 && p.z < 6; };
  const iv = setInterval(() => {
    if (G.token !== tk || !Rm || G.over) { clearInterval(iv); return; }
    if (stage === 0 && !seen()) {
      stage = 1; G.f.movedDone = true;
      n.goal = { rot: [n.rot[0], n.rot[1] + (Math.random() < .5 ? -1 : 1) * (.7 + Math.random() * .5), n.rot[2]], k: 30 };
    } else if (stage === 1 && seen()) {
      clearInterval(iv); Snd.creak();
      say('The ' + (LABELS[id] || 'thing').toLowerCase() + ' has turned to face you. Nobody touched it.', 4200); addDread(5);
    }
  }, 300);
  setTimeout(() => clearInterval(iv), 120000);
}

/* ---------- hiding places: when he is coming, get out of sight ----------
   In every room one piece of furniture will hide you. Tap it while his footsteps are coming (or once he is in, if
   you are already next to it): you crouch out of sight and watch the door through a gap, and he does not see you. */
const HIDES = {
  foyer: { chair: { at: [-1.95, -1.55], label: 'cushion chair', hint: 'Get down behind the cushion chair', txt: 'You crouch down behind the cushion chair and make yourself small.' } },
  nursery: { wardrobe: { at: [-.7, 2.5], label: 'wardrobe', hint: 'Get into the wardrobe', txt: 'You squeeze into the wardrobe and pull the doors almost shut.' } },
  kitchen: { ktable: { at: [.1, .3], label: 'kitchen table', hint: 'Get under the kitchen table', txt: 'You crawl under the kitchen table, behind the long lace cloth.' } },
  cellar: { hidedrum: { at: [-2.45, -2.35], label: 'water drum', hint: 'Get into the blue water drum', txt: 'You climb into the water drum and pull the lid down.' } },
  study: { sdesk: { at: [0, -1.35], label: 'desk', hint: 'Get under Papa’s desk', txt: 'You fold yourself into the dark under Papa’s desk.' } },
  chapel: { pews: { near: [[-1.5, -.55], [-1.5, .8], [1.5, -.55], [1.5, .8]], label: 'bench', hint: 'Get under a bench', txt: 'You lie flat under the bench, your cheek on the cold floor.' } },
  attic: { sheet: { at: [1.75, 0], label: 'wardrobe', hint: 'Get into Papa’s wardrobe under the Ankara wrapper', txt: 'You slip behind the Ankara wrapper into Papa’s wardrobe. It smells of camphor.' } }
};
const hideFor = id => { const r = HIDES[roomKey()]; return r ? r[id] : null; };
function hideSpotPos(h) {
  if (h.at) return h.at;
  const c = G.cam.pos;
  return h.near.slice().sort((a, b) => Math.hypot(a[0] - c[0], a[1] - c[2]) - Math.hypot(b[0] - c[0], b[1] - c[2]))[0];
}
function nearestHide() {
  const r = HIDES[roomKey()]; if (!r || !G.cam) return null;
  let best = null;
  for (const id in r) { const h = r[id], p = hideSpotPos(h), d = Math.hypot(p[0] - G.cam.pos[0], p[1] - G.cam.pos[2]); if (!best || d < best.d) best = { id, h, d }; }
  return best;
}
function hideFromVisit(h) {
  if (CH.hidden) return;
  PRES.hid = true;
  const p = hideSpotPos(h);
  hideIn(p, h.label, { visit: true, txt: h.txt });
  G.cam.yaw = Math.atan2(-p[0], p[1]); G.cam.pitch = .05;   // look out toward the middle of the room
}
// tap() hands its taps here while a visit is on: a hiding place hides you, anything else gives you away
function visitTap(id) {
  const h = hideFor(id);
  if (CH.hidden && PRES.hid) { say('Not yet. He is still out there.', 1800); return; }
  if (h) { hideFromVisit(h); return; }
  PRES.tapped = true;
}

/* ================= ADS: optional, and only where an ad can really play ================= */
/* The game never depends on an ad. On CrazyGames (their SDK is loaded by the CrazyGames build only)
   a player can choose a short video to skip the wait for a hint, or to relight a lantern when the last one
   goes out. Everywhere else (the Cloudflare site, the APK, this preview) there are no ad buttons at all. */
const ADS = { prov: null, adblock: false, playing: false };

async function adsInit() {
  const C = window.CrazyGames && window.CrazyGames.SDK;
  if (!C) return;
  try {
    await C.init();
    if (C.environment === 'crazygames' || C.environment === 'local') ADS.prov = 'cg';
    try { ADS.adblock = !!(await C.ad.hasAdblock()); } catch (e) { /* unknown: assume none */ }
  } catch (e) { ADS.prov = null; }
}
const adsCanReward = () => ADS.prov === 'cg' && !ADS.adblock && !ADS.playing;

/* tell the portal when real play starts and stops (CrazyGames asks for this) */
function adsGameplay(on) {
  if (ADS.prov !== 'cg') return;
  try { const g = window.CrazyGames.SDK.game; if (on) g.gameplayStart(); else g.gameplayStop(); } catch (e) { /* ignore */ }
}

/* a rewarded video. onReward only runs if the ad played to the end. */
function rewardedAd(onReward, onFail) {
  if (!adsCanReward()) { if (onFail) onFail('unavailable'); return; }
  ADS.playing = true;
  const wasPaused = G.paused;
  let started = false;
  const resume = () => { ADS.playing = false; if (started) { Snd.adMute(false); G.paused = wasPaused; adsGameplay(true); } };
  adsGameplay(false);
  try {
    window.CrazyGames.SDK.ad.requestAd('rewarded', {
      adStarted: () => { started = true; G.paused = true; Snd.adMute(true); },
      adFinished: () => { resume(); if (onReward) onReward(); },
      adError: err => { resume(); if (!started) adsGameplay(true); if (onFail) onFail(err && err.code || 'other'); }
    });
  } catch (e) { ADS.playing = false; adsGameplay(true); if (onFail) onFail('other'); }
}

/* the little film icon that marks an ad button */

  return `<g transform="translate(${x} ${y}) scale(${s * f * ch} ${s * ch}) translate(0 -120)" fill="${c}">${legs}${body}${arms}${head}${fringe}${eyes}${rimp}</g>`;

/* ---------- the reader ---------- */
const comicEl = (() => {
  const el = document.createElement('section'); el.id = 'comic'; el.setAttribute('aria-live', 'polite');
  el.innerHTML = '<div class="cpage"></div><button class="cskip" type="button">Skip</button><div class="cnext" aria-hidden="true">Tap to continue</div>';
  document.body.appendChild(el); return el;
})();
const SNDS = { phone: () => Snd.phone(), slam: () => Snd.slam(), slams: () => { [0, 350, 700, 1100].forEach(t => setTimeout(() => Snd.slam(), t)); }, whisper: () => Snd.whisper(), shriek: () => Snd.shriek(), clack: () => Snd.click(), steps: () => { for (let i = 0; i < 6; i++) setTimeout(() => Snd.step(), i * 160); }, rain: () => Snd.rain(), rooster: () => Snd.rooster(), engine: () => Snd.okada(), bus: () => Snd.bus() };
let artN = 0;
/* every inline drawing gets its own gradient/pattern ids, or panels on one page would borrow each other's */
const uniqIds = svg => { const n = ++artN; return svg.replace(/id="([^"]+)"/g, (m, id) => `id="${id}_${n}"`).replace(/url\(#([^)]+)\)/g, (m, id) => `url(#${id}_${n})`); };
function panelHtml(p, past) {
  const img = (typeof COMIC_IMG !== 'undefined' && COMIC_IMG[p.art]) ? `<img src="${COMIC_IMG[p.art]}" alt="">` : `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${uniqIds((COMIC_ART[p.art] || COMIC_ART.e_end)())}</svg>`;
  const balloons = (p.say || []).map((b, i) => `<div class="cbal${b.who === 'ojuju' ? ' ojuju' : ''}" data-x="${b.x}" data-y="${b.y}" style="left:${b.x}%;top:${b.y}%;--d:${(.35 + i * .9).toFixed(2)}s">${b.who === 'ojuju' ? '' : `<b>${esc(b.who)}</b>`}${esc(b.t)}</div>`).join('');
  return `<figure class="cpanel${p.past || past ? ' past' : ''}" data-art="${p.art}">${img}${p.cap ? `<figcaption class="ccap">${esc(p.cap)}</figcaption>` : ''}${p.sfx ? `<div class="csfx">${esc(p.sfx)}</div>` : ''}${balloons}</figure>`;
}

    : `<div class="knobs">${order.map(s => `<button class="knob sym" data-s="${s}" aria-label="${s}">${symIcon(s, 34)}</button>`).join('')}</div>`;

    </div>`, { cls: 'lockpanel' });

}

/* ---------- dread ---------- */
function updDread() {

}
function addDread(n) {

/* full: throw away this room's progress and start it over; otherwise keep it and just wake at the door */

/* Hints: the first note in every room is free. After that the next one comes back to you after a short wait,
   or straight away if you choose to watch a short ad (only where ads can actually play). */
const HINT_WAIT = 45;
let hintGateT = 0;
function openHint() {
  const read = G.f.hintsRead || 0, left = Math.ceil(HINT_WAIT - (Date.now() - (G.hintAt || 0)) / 1000);
  if (read === 0 || left <= 0) return showHint();
  const canAd = adsCanReward();
  openModal(`<div class="fold hintgate"><div class="fold-k">Mama’s voice, in your head</div>
      <p>The next note is still coming back to you.</p><div class="hwait"><b id="hwT">0:${String(left).padStart(2, '0')}</b><small>until you remember it</small></div></div>
      <div class="row">${canAd ? `<button class="btn" data-ad>${AD_ICON} Watch a short ad to read it now</button>` : ''}<button class="btn" data-x>Keep looking</button></div>
      <p class="msg" id="hwMsg" aria-live="polite"></p>`, { cls: 'note' });
  clearInterval(hintGateT);
  hintGateT = setInterval(() => {
    const el = $('#hwT'); if (!el) { clearInterval(hintGateT); return; }
    const l = Math.ceil(HINT_WAIT - (Date.now() - (G.hintAt || 0)) / 1000);
    if (l <= 0) { clearInterval(hintGateT); closeModal(); showHint(); return; }
    el.textContent = '0:' + String(l).padStart(2, '0');
  }, 250);
  panel.onclick = e => {
    if (e.target.closest('[data-x]')) { clearInterval(hintGateT); closeModal(); }
    else if (e.target.closest('[data-ad]')) {
      const b = e.target.closest('[data-ad]'); b.disabled = true;
      rewardedAd(() => { clearInterval(hintGateT); closeModal(); G.hintAt = 0; Snd.chime(); showHint(); },
        () => { b.remove(); const m = $('#hwMsg'); if (m) m.textContent = 'No ad is available right now. The note will come back to you soon.'; });
    }
  };
}
function showHint() {
  G.f.hintsRead = (G.f.hintsRead || 0) + 1; G.hintAt = Date.now(); queueSave();
  const key = ROOMS[G.room].key, list = STEPS[key] || [];
  let idx = list.findIndex(s => !s.done(G.f));
  const miss = missingPages(key);
  let s, hkey;
  if ((idx < 0 || idx === list.length - 1) && miss.length) {
    s = { h: [`${miss.length === 1 ? 'A memory page is' : miss.length + ' memory pages are'} still hidden in this room. Not every thing in the house is only scenery.`, `Look closely at ${miss[0].where}.`] };
    hkey = key + ':pg' + miss[0].id;
  } else {
    if (idx < 0) idx = list.length - 1;
    s = list[idx]; hkey = key + ':' + idx;
  }
  const lv = G.hintLv[hkey] || 0;
  const text = s.h[Math.min(lv, s.h.length - 1)];
  G.hintLv[hkey] = Math.min(lv + 1, s.h.length);
  if (lv === 0 || lv < s.h.length) G.hints++;
  const more = lv + 1 < s.h.length;
  openModal(`<div class="fold"><div class="fold-k">Mama’s voice, in your head</div><p>${text}</p><div class="sig">— Mama</div></div>
    <div class="row"><button class="btn" data-x>Fold it away</button>${more ? '<button class="btn primary" data-more>Read further</button>' : ''}</div>`, { cls: 'note' });
  panel.onclick = e => {
    if (e.target.closest('[data-x]')) closeModal();
    else if (e.target.closest('[data-more]')) { closeModal(); openHint(); }
  };
}

/* ---------- 3D view, movement and touch controls ---------- */
const REACH = 3.4;
let glOK = false;
const redraw = () => { if (Rm) Rm.api.apply(G.f); };
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const keys = {}, joy = { x: 0, y: 0 };
const canAct = () => G.started && !G.paused && !G.busy && !G.over && !modalOpen();

let lastTs = 0, stepAcc = 0, bobPh = 0, aimT = 0;
function move(dt) {
  const cam = G.cam;
  let jx = joy.x, jy = joy.y;
  if (keys.KeyW || keys.ArrowUp) jy += 1;
  if (keys.KeyS || keys.ArrowDown) jy -= 1;
  if (keys.KeyD) jx += 1;
  if (keys.KeyA) jx -= 1;
  if (keys.ArrowLeft) cam.yaw -= 1.8 * dt;
  if (keys.ArrowRight) cam.yaw += 1.8 * dt;
  const shook = shaken();
  if (shook && !reduceMotion) { const tt = performance.now() / 1000; cam.yaw += Math.sin(tt * 1.7) * .12 * dt; cam.pitch += Math.sin(tt * 2.3) * .06 * dt; }
  const eye = CH.hidden ? .8 : 1.6;
  if (frozen()) { cam.pos[1] += (eye - cam.pos[1]) * Math.min(1, dt * 8); return; }
  const m = Math.hypot(jx, jy);
  if (m < .06) { cam.pos[1] += (eye - cam.pos[1]) * Math.min(1, dt * 8); return; }
  const k = Math.min(1, m);
  jx /= m; jy /= m;
  const sp = 2.0 * k * dt * (shook ? .45 : 1), s = Math.sin(cam.yaw), c = Math.cos(cam.yaw);
  const dx = (s * jy + c * jx) * sp, dz = (-c * jy + s * jx) * sp;
  R3.collide(cam.pos, dx, dz, .3, Rm.sc);
  const d = Math.hypot(dx, dz);
  stepAcc += d; bobPh += d;
  if (stepAcc > .62) { stepAcc = 0; Snd.step(); }
  cam.pos[1] = 1.6 + (reduceMotion ? 0 : Math.sin(bobPh * 7) * .012);
}

let manualClock = false; // debug: the trailer recorder steps the game one exact frame at a time
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (ts - lastTs) / 1000 || .016);
  lastTs = ts;
  if (manualClock) return;
  frameStep(dt);
}
function frameStep(dt) {
  if (!glOK || !Rm || document.hidden || R3.lost || !G.started) return;
  for (let i = fx.length - 1; i >= 0; i--) if (fx[i](dt) === false) fx.splice(i, 1);
  const cam = G.cam, sc = Rm.sc;
  if (canAct()) { move(dt); checkZones(); watchPerf(dt); checkTree(); }
  const pp = sc.player.p || (sc.player.p = [0, 0, 0]); pp[0] = cam.pos[0] + Math.sin(cam.yaw) * .25; pp[1] = 1.5; pp[2] = cam.pos[2] - Math.cos(cam.yaw) * .25;
  R3.update(sc, cam, dt);
  R3.render(sc, cam);
  aimT += dt;
  if (aimT > .14) { aimT = 0; updateAim(); }
}

function updateAim() {
  const aim = $('#aim'), ret = $('#reticle');
  let label = '';
  if (canAct()) {
    const h = R3.pick(Rm.sc, G.cam, 0, 0);
    if (h && h.t <= REACH && LABELS[h.id]) {
      label = LABELS[h.id];
      const t = TAPS[h.id];
      if (G.sel && t && t.use && t.use[G.sel]) label = G.lang === 'pcm' ? 'Use ' + ITEMS[G.sel].name.toLowerCase() + ' for ' + tr(label).toLowerCase() : 'Use ' + ITEMS[G.sel].name.toLowerCase() + ' on ' + label.toLowerCase();
    }
  }
  if (aim.textContent !== label) aim.textContent = label;
  aim.classList.toggle('on', !!label);
  ret.classList.toggle('hot', !!label);
  useBtn.classList.toggle('hot', !!label);
}

function tapAt(cx, cy) {
  if (!Rm || !canAct()) return;
  const r = glEl.getBoundingClientRect();
  const fxEl = document.createElement('div');
  fxEl.className = 'tapfx'; fxEl.style.left = (cx - r.left) + 'px'; fxEl.style.top = (cy - r.top) + 'px';
  stage.appendChild(fxEl); setTimeout(() => fxEl.remove(), 480);
  const hit = R3.pick(Rm.sc, G.cam, (cx - r.left) / r.width * 2 - 1, -((cy - r.top) / r.height * 2 - 1));
  if (!hit) return;
  if (hit.t > REACH) { say('Too far away. Walk closer.', 1800); return; }
  tap(hit.id);
}

/* ---- look and tap: one finger on the view ---- */
const look = { id: null, x: 0, y: 0, sx: 0, sy: 0, t: 0, moved: false };
glEl.addEventListener('pointerdown', e => {
  if (look.id !== null || (e.pointerType === 'mouse' && e.button !== 0)) return;
  Snd.init();
  look.id = e.pointerId; look.x = look.sx = e.clientX; look.y = look.sy = e.clientY; look.t = performance.now(); look.moved = false;
  try { glEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
});
glEl.addEventListener('pointermove', e => {
  if (e.pointerId !== look.id) return;
  const dx = e.clientX - look.x, dy = e.clientY - look.y;
  look.x = e.clientX; look.y = e.clientY;
  if (!look.moved && Math.hypot(e.clientX - look.sx, e.clientY - look.sy) > 7) look.moved = true;
  if (look.moved && canAct()) {
    const k = LOOK_SPD[G.look] || 1;
    G.cam.yaw += dx * .0062 * k;
    G.cam.pitch = clamp(G.cam.pitch - dy * .005 * k, -1.15, 1.15);
  }
});
const endLook = e => {
  if (e.pointerId !== look.id) return;
  const wasTap = !look.moved && e.type === 'pointerup' && performance.now() - look.t < 520;
  look.id = null;
  if (wasTap) tapAt(e.clientX, e.clientY);
};
glEl.addEventListener('pointerup', endLook);
glEl.addEventListener('pointercancel', endLook);
glEl.addEventListener('contextmenu', e => e.preventDefault());

/* ---- walk stick: fixed in the bottom-left corner. Only a thumb on the stick walks; a tap there does nothing else ---- */
const joyEl = $('#joy'), knob = $('#joyKnob'), joyZone = $('#joyZone');
let joyId = null, joyCx = 0, joyCy = 0;
const JOY_R = () => joyEl.offsetWidth / 2 - 6;
function joyMove(e) {
  const R = JOY_R();
  let dx = e.clientX - joyCx, dy = e.clientY - joyCy;
  const l = Math.hypot(dx, dy);
  if (l > R) { dx *= R / l; dy *= R / l; }
  const m = Math.min(1, Math.hypot(dx, dy) / R), dead = .12, k = m < dead ? 0 : (m - dead) / (1 - dead);
  const a = Math.atan2(dy, dx);
  joy.x = Math.cos(a) * k; joy.y = -Math.sin(a) * k;
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
}
function joyReset() { try { joyId = null; joy.x = joy.y = 0; knob.style.transform = ''; joyEl.classList.remove('live'); } catch (e) { /* not built yet */ } }
joyZone.addEventListener('pointerdown', e => {
  // a new thumb on the stick always takes it over: if a finger's lift was ever lost (a pop-up opening under it,
  // a call coming in), the stick must never stay "held" by a finger that is no longer there
  if (joyId !== null && joyId !== e.pointerId) joyReset();
  joyId = e.pointerId; Snd.init();
  const r = joyEl.getBoundingClientRect(); joyCx = r.left + r.width / 2; joyCy = r.top + r.height / 2;
  joyEl.classList.add('live');
  try { joyZone.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  joyMove(e); e.preventDefault();
});
joyZone.addEventListener('pointermove', e => { if (e.pointerId === joyId) joyMove(e); });
const joyEnd = e => {
  if (e.pointerId !== joyId) return;
  joyId = null; joy.x = joy.y = 0; knob.style.transform = ''; joyEl.classList.remove('live');
  e.preventDefault();
};
joyZone.addEventListener('pointerup', joyEnd);
joyZone.addEventListener('pointercancel', joyEnd);
joyZone.addEventListener('lostpointercapture', joyEnd);
window.addEventListener('pointerup', e => { if (e.pointerId === joyId) joyReset(); }, true);
document.addEventListener('visibilitychange', joyReset);
joyZone.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); });

/* ---- the Use button: acts on whatever is under the dot ---- */
const useBtn = $('#useBtn');
useBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); Snd.init(); useBtn.classList.remove('press'); void useBtn.offsetWidth; useBtn.classList.add('press'); });
useBtn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); });
useBtn.addEventListener('pointerup', e => {
  e.preventDefault(); e.stopPropagation();
  if (!Rm || !canAct()) return;
  const h = R3.pick(Rm.sc, G.cam, 0, 0);
  if (!h || !LABELS[h.id]) { say('Nothing there. Turn until the dot glows on something.', 2200); return; }
  if (h.t > REACH) { say('Too far away. Walk closer.', 1800); return; }
  tap(h.id);
});

/* ---- either way up works; sideways is suggested ---- */
const LOOK_SPD = { slow: .65, normal: 1, fast: 1.45 };
/* graphics: Auto starts on High and drops to Low by itself if the phone struggles */
G.gfx = store.get('oc_gfx') || 'auto';
// on Auto, phones with little memory or few cores start on Low straight away instead of stuttering first
G.autoLow = ((navigator.deviceMemory || 8) <= 3 || (navigator.hardwareConcurrency || 8) <= 4) && isTouchNow();
function isTouchNow() { return !!(window.matchMedia && matchMedia('(pointer: coarse)').matches); }
const applyGfx = () => R3.setQuality(G.gfx === 'low' || (G.gfx === 'auto' && G.autoLow) ? 'low' : 'high');
let perfT = 0, perfN = 0, perfSum = 0;
function watchPerf(dt) {
  if (G.gfx !== 'auto' || G.autoLow) return;
  perfT += dt; perfN++; perfSum += dt;
  if (perfT > 4) {
    if (perfSum / perfN > .045) { G.autoLow = true; applyGfx(); say('Your phone was struggling, so the graphics are now set to Low. You can change this in the menu.', 5200); }
    perfT = perfN = perfSum = 0;
  }
}
G.look = store.get('oc_look') || 'normal';
const isTouch = () => window.matchMedia && matchMedia('(pointer: coarse)').matches;
let rotShown = false;
function checkOrient() { // landscape is suggested once per session, never forced
  const portrait = isTouch() && window.innerHeight > window.innerWidth;
  document.body.classList.toggle('portrait', portrait);
  if (!portrait) { hideRot(); return; }
  if (!rotShown && G.started && store.get('oc_upright') !== '1') { rotShown = true; document.body.classList.add('needrot'); joy.x = joy.y = 0; }
}
function hideRot() { document.body.classList.remove('needrot'); }
$('#rotSide').addEventListener('click', () => { goLandscape(true); hideRot(); });
$('#rotUp').addEventListener('click', () => { hideRot(); });
$('#rotAlways').addEventListener('click', () => { store.set('oc_upright', '1'); hideRot(); });
window.addEventListener('resize', checkOrient);
window.addEventListener('orientationchange', () => setTimeout(checkOrient, 120));
function goLandscape(lockIt = false) { // only works from a tap; quietly does nothing where it isn't allowed
  if (!isTouch()) return;
  try {
    const el = document.documentElement, lock = () => { try { const p = screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'); if (p && p.catch) p.catch(() => {}); } catch (e) { /* not allowed */ } };
    if (!document.fullscreenElement && el.requestFullscreen) { const p = el.requestFullscreen({ navigationUI: 'hide' }); if (p && p.then) p.then(lockIt ? lock : () => {}, () => {}); } else if (lockIt) lock();
  } catch (e) { /* not allowed */ }
}

/* ---- keyboard (desktop) ---- */
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if ((e.code === 'KeyE' || e.code === 'Space') && Rm && canAct()) {
    const r = glEl.getBoundingClientRect(); tapAt(r.left + r.width / 2, r.top + r.height / 2); e.preventDefault();
  }
  if (e.code.startsWith('Arrow') && G.started) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; joy.x = joy.y = 0; });

/* ---------- interactions ---------- */
function tap(id) {
  if (PRES.on) { visitTap(id); return; }
  if (CH.hidden) { if (CH.on || chasePending()) say('Not yet. It is still out there.', 1800); else unhide(); return; }   // inside a hiding place, any tap is “climb out” once it is safe
  if (!G.started || G.busy || G.over || modalOpen()) return;
  Snd.init();
  const h = TAPS[id];
  if (!h) return;
  Snd.tap();
  const s = G.sel;
  if (s && h.use && h.use[s]) h.use[s]();
  else if (h.tap) h.tap();
  queueSave();
}

/* leaving a room is one-way, so warn when memory pages are still lying about */
/* go through the door a moment from now, but only from this same room: a second tap on the open
   door must never let the old timer push you through the next room's door as well */
function leaveSoon(ms) { const r = G.room, tk = G.token; setTimeout(() => { if (G.room === r && G.token === tk) goNext(); }, ms); }
/* things a later room needs: the door will not let you through without them, so nobody reaches the roof empty-handed */
const NEEDED = {
  cellar: [{ id: 'hammer', where: 'It is in the red toolbox on the workbench.' }],
  chapel: [{ id: 'whitecloth', where: 'It is on Mama’s prayer table. Tap the table again.' }]
};
function missingItems() {
  return (NEEDED[ROOMS[G.room].key] || []).filter(n => !has(n.id) && G.dropped !== n.id);
}
function goNext() {
  if (G.f.left || G.f.asking || G.over) return;
  const need = missingItems();
  if (need.length) {
    const n = need[0];
    Snd.wrong();
    openModal(`<h2>Not yet</h2><p class="lead">Something in this room still has to come with you: the ${ITEMS[n.id].name.toLowerCase()}. You will need it later, and you cannot come back once you go through.</p><p>${n.where}</p>`, { dismiss: true });
    return;
  }
  const miss = missingPages();
  if (miss.length && !G.f.leaveOK) {
    G.f.asking = true;
    openModal(`<h2>Before you go</h2><p class="lead">${miss.length === 1 ? 'There is 1 memory page' : 'There are ' + miss.length + ' memory pages'} you have not found in this room. You cannot come back once you go through.</p>
      <div class="col"><button class="btn primary" data-stay>Keep looking</button><button class="btn" data-go>Leave anyway</button></div>`, { dismiss: false });
    panel.onclick = e => {
      if (e.target.closest('[data-stay]')) { closeModal(); G.f.asking = false; }
      else if (e.target.closest('[data-go]')) { closeModal(); G.f.asking = false; G.f.leaveOK = true; goNext(); }
    };
    return;
  }
  G.f.left = true;
  if (G.room >= ROOMS.length - 1) return finale();
  enterRoom(G.room + 1);
}
const SYM_NOTE = { star: 659.25, moon: 523.25, sun: 392 }, SYM_AT = { star: 0, moon: 1, sun: 2 };
function playBox(first) {
  const order = PZ().box;
  G.busy = true;
  say(first ? 'A lullaby begins. Three symbols light up in turn.' : 'The box plays its three notes again.', 4200);
  [0, 1, 2].forEach(i => {
    const sym = order[i];
    setTimeout(() => { Snd.note(SYM_NOTE[sym]); if (Rm && Rm.api.mbLight) Rm.api.mbLight(SYM_AT[sym], true); }, 300 + i * 800);
    setTimeout(() => { if (Rm && Rm.api.mbLight) Rm.api.mbLight(SYM_AT[sym], false); }, 300 + i * 800 + 700);
  });
  setTimeout(() => {
    G.busy = false;
    addJournal('lullaby', 'The music box', 'It played three symbols in order:\n' + listWords(order) + '.');
    if (first) { say('A ' + order[0] + ', a ' + order[1] + ', a ' + order[2] + '. You write it down.', 4200); addDread(-14); }
  }, 300 + 3 * 800 + 300);
}
function checkCellarDoor() {
  if (G.f.padOpen && G.f.keyUsed && G.f.coffinOpen && !G.f.chaseDone) { if (!CH.on) cellarChase(); return; }   // he comes before you can leave
  if (G.f.padOpen && G.f.keyUsed) {
    Snd.open(); addDread(-25); redraw();
    say('Both locks give. The door opens onto the yard, and the back stair of the main house, climbing toward lamp oil and leather.');
    leaveSoon(2300);
  }
}
function lightCandle(c) {
  const SEQ = PZ().candles;
  const lit = G.f.lit = G.f.lit || [];
  if (lit.includes(c)) return say('The ' + c + ' candle is already burning.');
  if (c === SEQ[lit.length]) {
    lit.push(c); Snd.flame(); redraw(); addDread(-6);
    if (lit.length === SEQ.length) banish();
    else say('The ' + c + ' candle catches. The air gets colder.');
  } else {
    G.f.lit = []; Snd.snuff(); redraw();
    say('The flames gutter and die at once. A cold breath on your neck.'); speak('m_candles');
    addDread(12); scare('shade');
  }
}
function candleHandler(c) {
  return {
    tap() { say((G.f.lit || []).includes(c) ? 'The ' + c + ' candle burns steady.' : 'A ' + c + ' candle, unlit. You need a flame.'); },
    use: { matches() { lightCandle(c); } }
  };
}
function banish() {
  G.f.banished = true; G.busy = true; G.dread = 0; updDread();
  Snd.whisper();
  say('All four flames stand straight, then lean toward the window. For a moment Mama is there, young, in her green gele, the way she was the night she ran. She looks at the window, not at you, and fades. Only a memory. The house keeps those too.', 8000);
  const sc = Rm.sc, lady = sc.lady, glow = sc.ladyGlow;
  lady.vis = glow.vis = true; let t = 0;
  fx.push(dt => {
    t += dt;
    const a = t < .8 ? t / .8 : t > 3.4 ? Math.max(0, 1 - (t - 3.4) / .9) : 1;
    lady.alpha = .92 * a; glow.alpha = .38 * a; lady.pos[1] = 1.15 + Math.sin(t * 1.2) * .04;
    if (t > 4.3) { lady.vis = glow.vis = false; return false; }
    return true;
  });
  after(4400, () => {
    G.busy = false; G.f.windowOpen = true; Snd.open(); redraw();
    say('The boards fall away on their own. Cold air, and the smell of rain. Behind them, burglary-proof bars, and a padlock.', 6000);
  });
}

/* the kitchen jars: flour, salt, sugar, in that order */
function jar(id, name) {
  return {
    tap() {
      if (!G.f.rangeLit) return say('A glass jar. The label is too faded to make out in this light.');
      say(name === 'garri' ? 'Garri.' : { flour: 'Flour, gone grey and solid.', salt: 'Salt, wept into one damp lump.', sugar: 'Sugar. Ants got into it decades ago and never left.', tea: 'Lipton tea, the yellow label faded white.', rice: 'Rice, crawling with weevils so old they are dust.' }[name] || 'A jar.');
    }
  };
}

/* ---------- cowries: one hidden in every room ---------- */
const COWRIES = { foyer: [-1.75, -1.15], nursery: [-2.0, 1.62], kitchen: [-1.75, 1.6], cellar: [1.55, -2.4], study: [1.4, -1.2], chapel: [-2.6, .15], attic: [1.15, 2.35] };
G.cowries = [];
function addCowrie(key, B) {
  const p = COWRIES[key]; if (!p || G.cowries.includes(key)) return;
  const g = B.grp(null, p[0], .03, p[1], Math.random() * 6, 'cowrie');
  B.sph(g, 0, .02, 0, .045, { c: '#efe8da', s: 70 }, .55, 1.4); B.box(g, 0, .045, 0, .008, .004, .1, '#5a4a3a');
  B.sph(g, 0, .03, -.05, .018, { c: '#d9c9a8', s: 40 });
  B.hit(g, 0, .1, 0, .45, .35, .45);
  Rm.cowrie = g; Rm.cowrieGlint = B.glint(p[0], .25, p[1]);
}
function takeCowrie() {
  const key = ROOMS[G.room].key;
  if (G.cowries.includes(key) || !Rm.cowrie) return;
  G.cowries.push(key); addEver('oc_cowset', key); removeNode(Rm.cowrie); Rm.cowrie = null; if (Rm.cowrieGlint) Rm.cowrieGlint.off = true;
  const n = G.cowries.length;
  Snd.cowrie(); Snd.chime(); vibe(20);
  const relit = relightLantern();
  say((n === 7 ? 'The seventh cowrie. All of them. Effiong’s people say cowries bring the lost home.' : 'A small cowrie shell, smooth and white. ' + n + ' of 7.') + (relit ? ' One of your lanterns flickers back to life.' : ''), 4600);
  if (n > (+store.get('oc_cowries') || 0)) store.set('oc_cowries', n);
  queueSave();
}

/* ---------- rooms and flow ---------- */
function buildRoom(i, sv) {
  resetScares();
  const sc = R3.newScene(), B = makeBuilder(sc), api = ROOMS3D[ROOMS[i].key](B);
  sc.cam = G.cam;
  Rm = { sc, api };
  const sp = api.spawn;
  G.cam.pos = [sp.x, 1.6, sp.z]; G.cam.yaw = sp.yaw; G.cam.pitch = 0;
  api.apply(G.f);
  addCowrie(ROOMS[i].key, B);
  if (sv && sv.cam && ROOMS[i].key !== 'roof') { G.cam.pos = [clamp(sv.cam.x, -2.7, 2.7), 1.6, clamp(sv.cam.z, -2.7, 2.7)]; G.cam.yaw = sv.cam.yaw || 0; G.cam.pitch = sv.cam.pitch || 0; }
  if (sv || G.f.zn || Object.keys(G.f).length) R3.update(sc, G.cam, 2.5);   // let doors and lids jump straight to where they were
}
function enterRoom(i, o = {}) {
  G.room = i; G.sel = null; G.thr = {}; G.over = false; G.token++;
  lbCheckpoint(i);
  const sv = o.resume && !o.resume.fresh ? o.resume : null;
  if (sv) G.f = sv.f || {}; else if (!o.keep) G.f = {};
  if (sv && G.f.banished && !G.f.windowOpen) G.f.windowOpen = true; // the boards fall away on their own, even if you quit mid-vision
  const key = ROOMS[i].key;
  if (key === 'kitchen' && !has('matches') && !sv && !o.keep) { give('matches'); G.f.matchGift = true; }
  // saves from before the hammer and the white cloth existed: hand them over so the roof can still be finished
  if (i > 3 && i < ROOMS.length - 1 && !has('hammer') && G.dropped !== 'hammer') G.inv.push('hammer');
  if (key === 'attic' && !has('whitecloth') && G.dropped !== 'whitecloth') G.inv.push('whitecloth');
  if (!o.restore && !sv) G.snap = { inv: G.inv.slice(), journal: G.journal.map(j => ({ ...j })), pages: G.pages.slice() };
  if (!o.restore && !sv && CHAPTERS.some(c => c.start === i)) G.chap = { room: i, inv: G.inv.slice(), journal: G.journal.map(j => ({ ...j })), pages: G.pages.slice(), cowries: G.cowries.slice() };
  if (G.lives == null || G.lives <= 0) G.lives = LIVES_MAX;
  renderLives();
  G.dread = sv ? (sv.dread || 10) : o.restore ? 35 : 10;
  if (G.mode === 'gentle') G.dread = 0;
  $('#roomName').textContent = ROOMS[i].name;
  updDread(); renderBag();
  if (glOK) buildRoom(i, sv);
  lastSig = '';
  save(false);
  if (sv || o.restore) {
    G.busy = false; G.paused = false;
    say(sv ? 'You are back where you left off.' : 'You wake at the door of the room, cold to the bone.', 4600);
    if (G.mode !== 'gentle' && !sv) G.dread = 35;
    onRoomStart();
    return;
  }
  showCard(i, () => {
    onRoomStart();
    say(ROOMS[i].intro + (G.f.matchGift ? ' A matchbox lies on the tiles. You take it.' : ''), 8000);
    if (G.pendingHow) { G.pendingHow = false; howTo(); }
  });
}
function showCard(i, then) {
  const R = ROOMS[i], c = $('#card');
  c.innerHTML = `<div class="k">${R.escape ? 'The way out' : 'Room ' + (i + 1) + ' of 7'}</div><h2>${R.name}</h2><p>${R.sub}</p><p class="ep">${EPIGRAPHS[R.key] || ''}</p>`;
  c.classList.remove('on'); void c.offsetWidth; c.classList.add('on');
  G.paused = true; G.busy = true;
  // a tap anywhere goes straight into the room (after a beat, so the tap that opened the door can't skip it by accident)
  let done = false;
  const t0 = performance.now();
  const finish = () => {
    if (done) return; done = true;
    clearTimeout(timer); document.removeEventListener('pointerdown', skip, true);
    c.classList.remove('on'); G.paused = false; G.busy = false; if (then) then();
  };
  const skip = e => { if (performance.now() - t0 < 450 || !c.classList.contains('on')) return; e.preventDefault(); e.stopPropagation(); finish(); };
  const timer = setTimeout(finish, 2800);
  document.addEventListener('pointerdown', skip, true);
}

/* ---------- saving (also mid-room) ---------- */
let svT = 0, lastSig = '';
function queueSave() { clearTimeout(svT); svT = setTimeout(() => save(true), 700); }
function cleanFlags(f) {
  const o = {};
  for (const k in f) if (k[0] !== '_' && k !== 'left' && k !== 'asking' && k !== 'leaveOK') o[k] = f[k];
  return o;
}
function snapshot() {
  return {

const cutEl = $('#cut'), ckEl = $('.ck', cutEl), ctEl = $('.ct', cutEl);
function cutscene(slides, done, onSlide) {
  let i = 0, spans = [], rev = 0, tm = 0, full = false;
  G.busy = true;
  cutEl.classList.add('on');
  const finish = () => { clearTimeout(tm); cutEl.classList.remove('on', 'show', 'done', 'scrawl'); cutEl.onclick = null; $('.cskip', cutEl).onclick = null; G.busy = false; if (done) done(); };
  const revealAll = () => { clearTimeout(tm); spans.forEach(s => s.classList.add('v')); full = true; cutEl.classList.add('done'); };
  const show = () => {
    const s = slides[i];
    full = false; rev = 0;
    cutEl.classList.remove('show', 'done'); cutEl.classList.toggle('scrawl', !!s.scrawl);
    ckEl.textContent = tr(s.k) || '';
    ctEl.innerHTML = String(tr(s.t)).split(/(\s+)/).map(w => /^\s*$/.test(w) ? w : `<span>${esc(w)}</span>`).join('');
    ctEl.scrollTop = 0;
    spans = $$('span', ctEl);
    $('.cgo', cutEl).textContent = s.end ? 'Tap to close' : 'Tap to continue';
    void cutEl.offsetWidth; cutEl.classList.add('show');
    if (onSlide) onSlide(i, s);
    const gap = clamp(6500 / Math.max(1, spans.length), 28, 120);
    const step = () => {
      if (rev < spans.length) { spans[rev++].classList.add('v'); tm = setTimeout(step, gap); } else revealAll();
    };
    tm = setTimeout(step, 650);
  };
  cutEl.onclick = e => {
    if (e.target.closest('.cskip')) return;
    if (!full) return revealAll();
    i++;
    if (i >= slides.length) return finish();
    show();
  };
  $('.cskip', cutEl).onclick = e => { e.stopPropagation(); finish(); };
  show();
}

function lbLive(refresh) {
  const t = document.body.classList.contains('lbtitle'); lbStopLive(); document.body.classList.toggle('lbtitle', t);
  lbPoll = setInterval(() => { if (!$('#lbList')) return lbStopLive(); if (!lbSock || lbSock.readyState !== 1) refresh(); }, 15000);

    const ws = lbSock = new WebSocket(`wss://${LB.ref}.supabase.co/realtime/v1/websocket?apikey=${LB.key}&vsn=1.0.0`);
    let ref = 1, hb = 0;
    ws.onopen = () => {

        payload: { config: { broadcast: { self: false }, presence: { key: '' }, postgres_changes: [{ event: '*', schema: 'public', table: 'scores' }] }, access_token: LB.key } }));
      hb = setInterval(() => { if (!$('#lbList')) { lbStopLive(); return; } ws.send(JSON.stringify({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: String(ref++) })); }, 25000);

   a while after you walk in. The room goes black, the neighbours' generators cough to life down the hill, and Tobi's
   torch comes on: it lights the room around you, but its batteries run down. Tap the torch on screen to switch it
   off and save them. In Haunted mode the dark feeds your fear, faster once the torch dies. After 25 to 35 seconds
   the light comes back, and the whole hill shouts "Up NEPA!". It happens at most once per room. */
const NEPA_ROOMS = ['foyer', 'nursery', 'kitchen', 'attic'];
const NEPA = { on: false, room: -1, end: 0, batt: 1, torch: true, armAt: 0, saved: null, tk: 0 };

const torchEl = (() => {
  const b = document.createElement('button');
  b.id = 'torch'; b.type = 'button'; b.setAttribute('aria-label', 'Torch: tap to switch off or on');
  b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10l-2 6v11a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 13h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="tb"><i></i></span><b class="tl">Torch</b>';
  $('#stage').appendChild(b);
  b.addEventListener('click', e => { e.stopPropagation(); if (!NEPA.on) return; NEPA.torch = !NEPA.torch; Snd.click && Snd.click(); syncTorch(); say(NEPA.torch ? 'You switch the torch back on.' : 'You switch the torch off to save the batteries. The dark comes right up to your face.', 2600); });
  return b;
})();
function syncTorch() {
  torchEl.classList.toggle('on', NEPA.on);
  torchEl.classList.toggle('off', !NEPA.torch || NEPA.batt <= 0);
  torchEl.classList.toggle('low', NEPA.batt < .25);
  const i = $('.tb i', torchEl); if (i) i.style.width = Math.round(NEPA.batt * 100) + '%';
}

// called from onRoomStart: decide whether, and when, the power goes in this room
function nepaRoomStart() {
  if (NEPA.on) nepaEnd(true);
  NEPA.armAt = 0;
  const k = roomKey();
  if (!NEPA_ROOMS.includes(k) || G.f.nepaDone || G.noNepa) return;
  if (G.f.nepaRoll == null) G.f.nepaRoll = Math.random() < .7 ? 1 : 0;   // seven rooms in ten
  if (!G.f.nepaRoll) return;
  NEPA.armAt = Date.now() + (30 + Math.random() * 45) * 1000;
}
function nepaReady() {
  return Rm && G.started && !G.over && !G.busy && !G.paused && !G.ending && !modalOpen() && !document.hidden &&
    !(typeof CH !== 'undefined' && (CH.on || CH.hidden)) && !(typeof PRES !== 'undefined' && PRES.on) && !(typeof QUIET !== 'undefined' && QUIET.on);
}
function nepaCut(force) {
  if (NEPA.on || !Rm || (!force && !nepaReady())) return false;
  const sc = Rm.sc, P = sc.player;
  NEPA.on = true; NEPA.room = G.room; NEPA.batt = 1; NEPA.torch = true; NEPA.tk = 0;
  NEPA.end = Date.now() + (25 + Math.random() * 10) * 1000;
  NEPA.saved = { k0: P.k0, k: P.k, r: P.r, fl: P.fl, c: P.c.slice() };
  G.f.nepaDone = true; queueSave();
  Snd.drop(); vibe && vibe([30]);
  say('Click. The fan winds down and every bulb dies at once. NEPA has taken light.', 4200, true);
  setTimeout(() => { if (NEPA.on) { Snd.generator(); say('Down the hill, the neighbours’ generators cough to life, one after another. Not this house. Your torch is in your hand.', 4800); } }, 2600);
  if (G.mode !== 'gentle' && typeof footstepsPass === 'function') setTimeout(() => { if (NEPA.on && nepaReady()) footstepsPass(); }, 9000 + Math.random() * 6000);
  syncTorch();
  let dimV = 1;
  fx.push(dt => {
    if (!NEPA.on || !Rm || Rm.sc !== sc) return false;
    dimV = Math.max(.035, dimV - dt * 6);
    sc.dim = sc.pdim = dimV;                       // re-asserted every frame, so a scare's blackout can't switch the mains back on
    const lit = NEPA.torch && NEPA.batt > 0;
    if (!G.paused && !modalOpen()) NEPA.batt = Math.max(0, NEPA.batt - (lit ? dt / 38 : 0));
    const flick = NEPA.batt < .25 && lit ? (Math.random() < .08 ? .3 : 1) : 1;
    P.k0 = P.k = lit ? (.8 + 1.5 * Math.min(1, NEPA.batt * 2.5)) * flick : .14;
    P.r = lit ? 7 : 1.8; P.fl = lit ? .02 : 0; P.c = lit ? [1, .95, .82] : [.6, .6, .75];
    return true;
  });
  return true;
}
function nepaEnd(quiet) {
  if (!NEPA.on) return;
  NEPA.on = false;
  const sameRoom = Rm && G.room === NEPA.room;
  if (Rm && NEPA.saved) Object.assign(Rm.sc.player, NEPA.saved, { c: NEPA.saved.c });
  if (Rm) Rm.sc.dim = Rm.sc.pdim = 1;
  syncTorch();
  if (quiet || !sameRoom) return;
  if (Rm.api.apply) redraw();
  scare('flicker'); setTimeout(() => Snd.cheer && Snd.cheer(), 900);
  say('The bulbs stutter, then hold. The fan creaks back to life. All over the hill, everybody shouts at once: “Up NEPA!”', 5200);
  if (G.mode !== 'gentle') addDread(-10);
}
setInterval(() => {
  if (NEPA.on) {
    if (!Rm || G.room !== NEPA.room || G.over) return nepaEnd(true);
    syncTorch();
    if (!G.paused && !modalOpen() && G.mode !== 'gentle') addDread(NEPA.torch && NEPA.batt > 0 ? .2 : 1);
    if (NEPA.batt <= 0 && !NEPA.tk) { NEPA.tk = 1; Snd.drop(); say('The torch gutters and dies. The dark comes all the way in.', 3400, true); }
    if (Date.now() >= NEPA.end && nepaReady()) nepaEnd(false);
    return;
  }
  if (NEPA.armAt && Date.now() >= NEPA.armAt && nepaReady()) { NEPA.armAt = 0; nepaCut(); }
}, 500);
if (window.__hm) Object.assign(window.__hm, { NEPA, nepaCut, nepaEnd, nepaRoomStart, HIDES, visitTap, nearestHide, HURT });

/* ================= EXTRAS: chapter select and the cowrie gallery ================= */
/* Chapter select opens after the first finish. A chapter run starts at that chapter's first room with what you
   would be carrying by then, new puzzle answers, and no leaderboard. Pages and cowries found in ANY run are kept in
   a lasting collection on this phone: a chapter run ends in the true ending once every page has been found at least
   once, so players can go back for the pages they missed.
   The gallery has seven pictures, one more for every cowrie ever found. Amuro's art replaces the placeholders:
   save it as assets/gallery/<id>.png (or .jpg / .webp), e.g. assets/gallery/g1.png, and rebuild. */
function everSet(k) { try { const v = store.get(k); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
function addEver(k, id) { const s = everSet(k); if (!s.includes(id)) { s.push(id); store.set(k, s); } }
function pagesEver() { return everSet('oc_pageset'); }
function cowriesEver() { return Math.max(everSet('oc_cowset').length, +store.get('oc_cowries') || 0); }
function allPagesEver() { return PAGES.every(p => pagesEver().includes(p.id) || G.pages.includes(p.id)); }
// function declarations, not consts: the title screen asks for these while the game is still loading
function chapterOpen() { return !!(store.get('hm3_done') || store.get('hm3_true')); }

/* ---- chapter select ---- */
const CHAPTER_START = [
  { room: 0, name: 'Chapter 1 · Downstairs', rooms: 'Living Room, Tobi’s Room, Mama’s Kitchen', inv: [] },
  { room: 3, name: 'Chapter 2', rooms: 'The Boys’ Quarters, Papa’s Office', inv: ['matches'] },
  { room: 5, name: 'Chapter 3 · Upstairs', rooms: 'Mama’s Prayer Room, the Master Bedroom, the Roof', inv: ['matches', 'hammer'] }
];
function openChapters() {
  const sv = readSave(), seen = pagesEver().length;
  openModal(`<h2>Chapter select</h2>
    <p class="lead">Go back in for the pages you missed. Pages found in any run count toward the whole story: ${seen} of ${PAGES.length} so far.</p>
    <div class="chlist">${CHAPTER_START.map((c, i) => `<button class="chbtn" data-ch="${i}"><b>${c.name}</b><span>${c.rooms}</span></button>`).join('')}</div>
    <p class="hint-note">Chapter runs have new puzzle answers and do not count for the leaderboard.${sv ? ' Starting one replaces your saved game.' : ''}</p>
    <div class="col"><button class="btn" data-x>Close</button></div>`, { onX: () => showTitle() });
  let armed = -1;
  panel.onclick = e => {
    if (e.target.closest('[data-x]')) { closeModal(); showTitle(); return; }
    const b = e.target.closest('[data-ch]'); if (!b) return;
    const i = +b.dataset.ch;
    if (sv && armed !== i) { armed = i; $$('.chbtn', panel).forEach(x => x.classList.remove('danger')); b.classList.add('danger'); $('span', b).textContent = 'Tap again to replace your save'; return; }
    closeModal(); Snd.init(); goLandscape(); startChapter(i);
  };
}
function startChapter(i) {
  const c = CHAPTER_START[i];
  store.del(SAVE_KEY); lastSig = '';
  G.inv = c.inv.slice(); G.journal = []; G.pages = []; G.cowries = []; G.hints = 0; G.scares = 0; G.hintLv = {};
  G.t0 = Date.now(); G.f = {}; G.snap = null; G.ending = false; G.lives = LIVES_MAX; G.chap = null; G.flash = [];
  G.puz = rollPuzzles(); G.run = null; G.finalMs = 0; G.chapterRun = i;
  $('#title').classList.add('off'); document.body.classList.remove('lbtitle');
  withLoading(() => { startPlay(); enterRoom(c.room); }, 900);
}

/* ---- the gallery ---- */
const MASK_SVG = `<svg viewBox="0 0 200 260" aria-hidden="true"><rect width="200" height="260" fill="#120c0a"/><path d="M100 26C58 26 40 64 44 116C47 160 66 196 100 206C134 196 153 160 156 116C160 64 142 26 100 26Z" fill="#2b1d16" stroke="#5c3d26" stroke-width="3"/><path d="M60 92Q80 80 92 96M140 92Q120 80 108 96" stroke="#d9cfb8" stroke-width="5" fill="none" stroke-linecap="round"/><ellipse cx="78" cy="108" rx="13" ry="9" fill="#0b0705"/><ellipse cx="122" cy="108" rx="13" ry="9" fill="#0b0705"/><path d="M100 112V146" stroke="#4a3220" stroke-width="6"/><path d="M74 166Q100 186 126 166" stroke="#0b0705" stroke-width="10" fill="none"/><path d="M80 168l6 8l6-8l6 8l6-8l6 8l6-8" stroke="#d9cfb8" stroke-width="3" fill="none"/>${Array.from({ length: 30 }, (_, i) => `<path d="M${46 + i * 3.6} 200Q${40 + i * 4} 232 ${30 + i * 4.6} 260" stroke="${['#8a6a2c', '#a9853c', '#6b5020'][i % 3]}" stroke-width="3" fill="none"/>`).join('')}</svg>`;
const STUDIO_SVG = `<svg viewBox="0 0 200 260" aria-hidden="true"><rect width="200" height="260" fill="#0c0a11"/>${[0, 1, 2, 3, 4].map(k => `<rect x="${k * 40}" y="0" width="20" height="14" fill="#127a72"/><rect x="${k * 40 + 20}" y="0" width="20" height="14" fill="#e2832a"/><rect x="${k * 40}" y="246" width="20" height="14" fill="#1d3a6b"/><rect x="${k * 40 + 20}" y="246" width="20" height="14" fill="#7a1f2b"/>`).join('')}<text x="100" y="118" text-anchor="middle" fill="#ece3d2" font-size="26" font-weight="800" font-family="Ojuju, sans-serif">MUNIAC</text><text x="100" y="146" text-anchor="middle" fill="#eb9440" font-size="16" font-weight="700" font-family="Ojuju, sans-serif">STUDIOS</text></svg>`;
const GALLERY = [
  { id: 'g1', title: 'Adeleke House', art: () => titleArt(), text: 'Built in 1972 at the very top of the hill above Oke-Ọla, with a chimney nobody in Nigeria needed. Every clock in it stopped at 7:20 on 14 October 1975.' },
  { id: 'g2', title: 'Ojuju Calabar', art: () => FACE_SILAS, text: 'What the hill children called the thing that walked the house. Tall, long-fingered, in raffia to the ground, with a dark carved face. Not evil for its own sake: it wanted its name back, and a burial.' },
  { id: 'g3', title: 'Adaeze Adeleke, Mama', art: () => GHOST_FACE, text: 'A teacher from Enugu. She knew something was wrong long before she could prove it, and on the worst night of her life she took her son and ran down the hill in the rain.' },
  { id: 'g4', title: 'Small Tobi', art: () => FACE_CHILD, text: 'Tobenna Oluwaseun Adeleke at four: two names, because he had two peoples. Effiong called him “my small driver”.' },
  { id: 'g5', title: 'The garden, 1974', art: () => FAMILY_PHOTO, text: 'Papa in his blue fila, Mama in her green gele, and Effiong Etim with small Tobi on his shoulders. The photograph Papa smashed.' },
  { id: 'g6', title: 'Ekpo', art: () => MASK_SVG, text: 'Ekpo is a masquerade society of the Ibibio and Annang peoples, around Ikot Ekpene in today’s Akwa Ibom State. Its masqueraders wear dark carved wooden masks and raffia, and are said to carry the spirits of the ancestors. Ojuju Calabar is a ghost story inspired by that tradition, not a picture of it.' },
  { id: 'g7', title: 'From Muniac Studios', art: () => STUDIO_SVG, text: 'Thank you for going back into the house. Ojuju Calabar is made in Nigeria by Muniac Studios. Story and art by Amuro.' }
];
const galleryArt = g => (typeof GALLERY_IMG !== 'undefined' && GALLERY_IMG[g.id]) ? `<img src="${GALLERY_IMG[g.id]}" alt="">` : g.art();
function openGallery(back) {
  const have = cowriesEver();
  openModal(`<h2>Gallery</h2>
    <p class="lead">One picture for every cowrie you have ever found: ${Math.min(have, 7)} of 7.</p>
    <div class="gal">${GALLERY.map((g, i) => i < have
      ? `<button class="gtile" data-g="${i}"><span class="gart">${galleryArt(g)}</span><b>${esc(g.title)}</b></button>`
      : `<div class="gtile locked" aria-label="Locked"><span class="gart"><svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="22" rx="10" ry="13" fill="none" stroke="#6b6355" stroke-width="2"/><path d="M20 12V32" stroke="#6b6355" stroke-width="2"/></svg></span><b>Find ${i + 1} cowrie${i ? 's' : ''}</b></div>`).join('')}</div>
    <div class="col"><button class="btn" data-x>Close</button></div>`, { onX: () => { if (back) back(); } });
  panel.onclick = e => {
    if (e.target.closest('[data-x]')) { closeModal(); if (back) back(); return; }
    const t = e.target.closest('[data-g]'); if (t) viewGallery(+t.dataset.g, back);
  };
}
function viewGallery(i, back) {
  const have = Math.min(cowriesEver(), GALLERY.length), g = GALLERY[i];
  openModal(`<div class="gview"><div class="gbig">${galleryArt(g)}</div><h2>${esc(g.title)}</h2><p>${esc(g.text)}</p></div>
    <div class="row">${i > 0 ? '<button class="btn" data-prev>Previous</button>' : ''}${i < have - 1 ? '<button class="btn" data-next>Next</button>' : ''}<button class="btn primary" data-x>Back</button></div>`, { onX: () => openGallery(back) });
  panel.onclick = e => {
    if (e.target.closest('[data-prev]')) viewGallery(i - 1, back);
    else if (e.target.closest('[data-next]')) viewGallery(i + 1, back);
    else if (e.target.closest('[data-x]')) openGallery(back);
  };
}
/* ---- end credits ---- */
/* Each entry is [role, names]: names is one name, or a list; a list item can be [name, what they did]. */
const CREDITS = [
  ['', 'OJUJU CALABAR'],
  ['Game by', 'Muniac Studios'],
  ['Idea & studio founder', 'Ochem Munachi Micheal'],
  ['Development & engineering', ['Ochem Munachi Micheal', 'Victor A. Klaus']],
  ['Story & design', 'Amuro Ayomiposi Daniel'],
  ['Project management', 'Taiye Hikmah Ayomide'],
  ['Quality testing lead', 'Gbar-Wokwe Yokossi D’Truth'],
  ['Character voices', [
    ['Amuro Ayomiposi', 'Tobenna Oluwaseun “Tobi” Adeleke · Chief Olumide Adeleke (Papa) · Small Tobi'],
    ['Willie David Enobang', 'Effiong Etim · Ojuju Calabar'],
    ['Taiye Hikmah Ayomide', 'Adaeze Adeleke (Mama)']]],
  ['Sound effects', ['Amuro Ayomiposi', 'Kenney (kenney.nl)', 'Mixkit (mixkit.co)', 'YouTube']],
  ['', 'Thanks for playing our game.'],
  ['', 'Remember, Ojuju is watching =)']
];
function rollCredits(done) {
  const el = document.createElement('div'); el.id = 'credits';
  const who = n => (Array.isArray(n) ? n : [n]).map(x => Array.isArray(x) ? `<b>${esc(x[0])}</b><em>${esc(x[1])}</em>` : `<b>${esc(x)}</b>`).join('');
  el.innerHTML = `<button class="btn skip" type="button">Skip</button><div class="croll">${CREDITS.map(([r, n], i) =>
    i === 0 ? `<h1>${esc(n)}</h1>` : `<p${r ? '' : ' class="cend"'}>${r ? `<span>${esc(r)}</span>` : ''}${who(n)}</p>`).join('')}</div>`;
  document.body.appendChild(el);
  const roll = $('.croll', el);
  const lines = CREDITS.reduce((k, [, n]) => k + 1 + (Array.isArray(n) ? n.length : 1), 0);
  const dur = Math.max(18, lines * 1.7);   // seconds to drift through it all: long enough to read every name
  /* The credits drift up by themselves, but they are a real scrolling list: drag or wheel them at any speed.
     Touching them pauses the drift; it picks up again a moment after you let go. The end, reached either way, finishes. */
  let over = false, raf = 0, last = 0, held = false, idleUntil = 0, endT = 0, pos = 0;
  const end = () => { if (over) return; over = true; cancelAnimationFrame(raf); el.classList.add('out'); setTimeout(() => { el.remove(); done && done(); }, 600); };
  const max = () => el.scrollHeight - el.clientHeight;
  const speed = () => max() / dur;   // pixels a second
  const tick = now => {
    if (over) return;
    const dt = last ? Math.min(.1, (now - last) / 1000) : 0; last = now;
    if (!held && now > idleUntil) { pos = Math.min(max(), (Math.abs(pos - el.scrollTop) > 2 ? el.scrollTop : pos) + speed() * dt); el.scrollTop = pos; }
    else pos = el.scrollTop;
    if (el.scrollTop >= max() - 2) { if (!endT) endT = now + 2200; else if (now > endT && !held) return end(); } else endT = 0;
    raf = requestAnimationFrame(tick);
  };
  const touch = () => { idleUntil = performance.now() + 2500; };
  el.addEventListener('pointerdown', () => { held = true; touch(); });
  window.addEventListener('pointerup', () => { held = false; touch(); });
  el.addEventListener('wheel', touch, { passive: true });
  el.addEventListener('touchmove', touch, { passive: true });
  el.addEventListener('keydown', touch);
  raf = requestAnimationFrame(tick);
  $('.skip', el).onclick = e => { e.stopPropagation(); end(); };
  try { Snd.init(); Snd.music(true); } catch (e) { /* no music */ }
}
if (window.__hm) Object.assign(window.__hm, { rollCredits, CREDITS, openChapters, startChapter, openGallery, GALLERY, pagesEver, cowriesEver, allPagesEver });

/* ================= COMPUTER CONTROLS ================= */
/* WASD or the arrow keys to walk. Click the view once and the mouse looks around (Esc frees it).
   Click, E or Space uses what the dot is on. J journal, H hint, M menu, 1–6 hold a tray item, Q put it away.
   Esc also closes anything with a ✕. Touch controls are untouched. */
const isDesktop = () => !!(window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches);
let lockFailed = false;
const lockOk = () => !!glEl.requestPointerLock && !lockFailed;
document.addEventListener('pointerlockerror', () => { lockFailed = true; syncClickHint(); say('Drag with the mouse to look around.', 3000); });
const locked = () => document.pointerLockElement === glEl;
const clickHint = document.createElement('div');
clickHint.id = 'clickLook'; clickHint.textContent = 'Click to look around';
stage.appendChild(clickHint);
function syncClickHint() {
  clickHint.classList.toggle('on', isDesktop() && lockOk() && G.started && !locked() && !modalOpen() && !G.over && !G.ending && $('#title').classList.contains('off'));
}
setInterval(syncClickHint, 300);

function lockMouse() {
  if (!isDesktop() || !lockOk() || locked()) return;
  try { const p = glEl.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* not allowed here: drag to look still works */ }
}
function useCentre() {
  if (!Rm || !canAct()) return;
  const r = glEl.getBoundingClientRect(); tapAt(r.left + r.width / 2, r.top + r.height / 2);
}
// with a mouse, a click on the view either grabs the mouse or (once grabbed) uses what the dot is on
glEl.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse' || !isDesktop() || !lockOk()) return;
  e.stopImmediatePropagation(); e.preventDefault();
  if (e.button !== 0) return;
  Snd.init();
  if (!locked()) { if (G.started && !modalOpen()) lockMouse(); return; }
  useCentre();
}, true);
glEl.addEventListener('pointerup', e => { if (e.pointerType === 'mouse' && isDesktop() && lockOk()) e.stopImmediatePropagation(); }, true);
document.addEventListener('mousemove', e => {
  if (!locked() || !canAct()) return;
  const k = (LOOK_SPD[G.look] || 1) * .0026;
  G.cam.yaw += e.movementX * k;
  G.cam.pitch = clamp(G.cam.pitch - e.movementY * k, -1.15, 1.15);
});
// anything that opens a page, a lock or the menu lets go of the mouse
new MutationObserver(() => { if (modalOpen() && locked()) document.exitPointerLock(); syncClickHint(); })
  .observe(modalEl, { attributes: true, attributeFilter: ['class'] });
document.addEventListener('pointerlockchange', syncClickHint);

window.addEventListener('keydown', e => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.code === 'Escape') {
    if (modalOpen() && modalEl._dismiss) { $('#modalX').click(); e.preventDefault(); }
    return;
  }
  if (!G.started || G.busy || G.over) return;
  if (modalOpen()) return;
  if (e.code === 'KeyJ') { e.preventDefault(); openJournal(); }
  else if (e.code === 'KeyH') { e.preventDefault(); openHint(); }
  else if (e.code === 'KeyM') { e.preventDefault(); openMenu(); }
  else if (e.code === 'KeyQ' && G.sel) { const it = ITEMS[G.sel]; G.sel = null; renderBag(); say('You put the ' + it.name.toLowerCase() + ' away.', 1800); }
  else if (/^Digit[1-6]$/.test(e.code)) {
    const slot = $$('#bag .slot[data-item]')[+e.code.slice(5) - 1];
    if (slot) slot.click();
  }
});

if (isDesktop()) { const lb = $('#loading .btn'); if (lb) lb.textContent = 'Click to enter'; }

})();
</script>
