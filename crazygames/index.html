/* Layout: one full-height phone screen. A slim bar on top, the room scene filling the middle,
   a tray of carried items along the bottom. Notes, locks and menus float over the scene. */
:root {
  color-scheme: dark;
  --ink: #0c0a11;
  --ink-2: #16121d;
  --ink-3: #221b2c;
  --line: #352a41;
  --bone: #ece3d2;
  --bone-dim: #b0a591;
  --ember: #eb9440;
  --ember-deep: #a65d22;
  --ghost: #a3dccf;
  --blood: #c02a3c;
  --paper: #dccfb2;
  --paper-ink: #2b2218;
  --font-display: "Ojuju", "Bricolage Grotesque", system-ui, sans-serif;
  --font-body: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

html, body { height: 100%; }
html { box-sizing: border-box; }
#scene text { font-family: var(--font-body); }
body {
  margin: 0;
  background: var(--ink);
  color: var(--bone);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.4;
  overflow: hidden;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior: none;
}
button { font-family: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, .hs:focus-visible { outline: 2px solid var(--ghost); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; overflow-wrap: anywhere; letter-spacing: .01em; }

#app {
  position: relative;
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--ink);
  overflow: hidden;
}

/* ---- top bar ---- */
#hud {
  flex: none;
  padding-block: 6px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(#0a080e, #100c16);
  border-bottom: 1px solid var(--line);
}
.hud-row { display: flex; align-items: center; gap: 4px; min-height: 40px; }
#roomName {
  flex: 1;
  min-width: 0;
  font-family: var(--font-display);
  font-size: 19px;
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--bone);
}
.ibtn {
  flex: none;
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border: 0; border-radius: 12px;
  background: transparent;
  color: var(--bone);
}
.ibtn:active { background: var(--ink-3); }
.ibtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ibtn.muted { color: var(--bone-dim); }
.ibtn .badge { position: absolute; }

#dreadRow { display: flex; align-items: center; gap: 8px; height: 14px; }
#dreadRow svg { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--ghost); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#dread { flex: 1; height: 6px; border-radius: 99px; background: #261f31; overflow: hidden; }
#dreadFill {
  height: 100%; width: 0%; border-radius: inherit;
  background: linear-gradient(90deg, var(--ghost), var(--ember) 62%, var(--blood));
  background-size: 100vw 100%;

/* ---- stage ---- */

.arrow {

#caption {

#scare, #shadeLayer, #flash { position: absolute; inset: 0; pointer-events: none; }

/* ---- modals ---- */
#modal {

.wheels { display: flex; justify-content: center; gap: 14px; margin: 14px 0 4px; }
.wheel { display: flex; flex-direction: column; align-items: center; gap: 4px; }

}
.slots { display: flex; justify-content: center; gap: 12px; margin: 14px 0; }

/* ---- title screen ---- */
#title {

}

/* ---- animations ---- */
.fl { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 1.3s ease-in-out infinite; }
.pupil { animation: look 8s ease-in-out infinite; }
.rock { transform-box: fill-box; transform-origin: 50% 100%; animation: rock 3.4s ease-in-out infinite; }
.sway { transform-box: fill-box; transform-origin: 50% 0%; animation: sway 5s ease-in-out infinite; }
.glint { animation: glint 2.2s ease-in-out infinite; pointer-events: none; }
.symlit { filter: drop-shadow(0 0 6px #ffd27a); }
.dim { opacity: .28; transition: opacity .2s; }
.symon { opacity: 1; fill: #ffd27a; }

@keyframes flick { 0%, 100% { transform: scale(1, 1); } 25% { transform: scale(.92, 1.1); } 50% { transform: scale(1.06, .94); } 75% { transform: scale(.96, 1.06); } }
@keyframes look { 0%, 35% { transform: translateX(0); } 42%, 68% { transform: translateX(-2.4px); } 76%, 100% { transform: translateX(2.4px); } }
@keyframes rock { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
@keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
@keyframes glint { 0%, 100% { opacity: .12; } 50% { opacity: .8; } }
@keyframes ripple { from { transform: scale(.3); opacity: .8; } to { transform: scale(2.2); opacity: 0; } }
@keyframes turn { from { opacity: .15; transform: translateX(10px); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
@keyframes shake { 0%, 100% { transform: translate(0, 0); } 15% { transform: translate(-7px, 3px); } 30% { transform: translate(6px, -4px); } 45% { transform: translate(-5px, 2px); } 60% { transform: translate(4px, 3px); } 80% { transform: translate(-2px, -2px); } }
@keyframes blackout { 0% { filter: brightness(.2); } 12% { filter: brightness(1); } 26% { filter: brightness(.12); } 40% { filter: brightness(.9); } 55% { filter: brightness(.18); } 100% { filter: brightness(1); } }
@keyframes scareflash { 0% { background: #fff; } 8% { background: #000; } 16% { background: #5a0000; } 100% { background: #000; opacity: 0; } }
@keyframes scarezoom { from { transform: scale(.55); } to { transform: scale(1.5); } }
@keyframes redflash { 0% { opacity: 1; } 100% { opacity: 0; } }
@keyframes shade { 0% { opacity: 0; transform: translateX(0); } 30% { opacity: .85; } 70% { opacity: .85; transform: translateX(8px); } 100% { opacity: 0; transform: translateX(10px); } }
@keyframes ghostcam { 0% { opacity: 0; transform: translateY(16px); } 25% { opacity: .92; transform: none; } 70% { opacity: .92; } 100% { opacity: 0; transform: translateY(-14px); } }
@keyframes cardfade { 0% { opacity: 0; } 18% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; } }
@keyframes eyewin { 0%, 100% { opacity: 1; } 47% { opacity: .35; } 52% { opacity: 1; } 80% { opacity: .6; } }

@media (prefers-reduced-motion: reduce) {
  .fl, .pupil, .rock, .sway, .glint, .eyewin { animation: none; }
  #stage.shake, #stage.flicker #scene { animation: none; }
  #scene.turn { animation: none; }
}

/* ================= 3D view ================= */

/* hurt: the screen after a jump scare lands */

  background: radial-gradient(ellipse at center, rgba(120, 0, 10, 0) 38%, rgba(110, 0, 12, .55) 78%, rgba(20, 0, 2, .9) 100%); }

/* ghost voices: words that appear in the dark, not in the caption bar */
#voice { position: absolute; left: 50%; top: 34%; z-index: 7; width: min(88%, 520px); text-align: center; pointer-events: none;
  transform: translate(calc(-50% + var(--vx, 0%)), var(--vy, 0%)); opacity: 0; transition: opacity .5s ease;
  font-family: var(--font-display); font-weight: 700; line-height: 1.15; text-wrap: balance; }

#voice span { display: inline-block; opacity: 0; animation: vIn .5s ease-out forwards; }
#voice.v-ojuju { font-size: clamp(30px, 8.5vw, 46px); font-weight: 800; letter-spacing: .06em; color: #f0e6dc;
  text-shadow: 0 0 2px #000, 0 0 18px rgba(200, 20, 20, .85), 0 0 40px rgba(120, 0, 0, .7); }
#voice.v-ojuju span { animation: vIn .35s ease-out forwards, vShake .09s linear infinite; }
#voice.v-mama { font-size: clamp(26px, 7vw, 36px); font-weight: 700; color: #e4f6ea; letter-spacing: .03em;
  text-shadow: 0 0 3px #000, 0 0 14px rgba(120, 210, 160, .8), 0 0 34px rgba(40, 120, 80, .7); }
#voice.v-mama span { animation: vSoft 1.1s ease-out forwards; }
#voice.v-kid { font-size: clamp(22px, 6vw, 28px); font-weight: 700; color: #fff2f2; letter-spacing: .08em;
  text-shadow: 0 0 3px #000, 0 0 10px rgba(255, 255, 255, .7), 0 0 22px rgba(200, 160, 255, .6); }
#voice.v-kid span { animation: vHop .3s ease-out forwards; }
#voice.v-tobi { font-size: clamp(18px, 4.6vw, 24px); font-weight: 600; font-style: italic; color: #f3e9d8; letter-spacing: .01em;
  font-family: var(--font-body); text-shadow: 0 1px 3px #000, 0 0 12px rgba(0, 0, 0, .8); }
#voice.v-tobi span { animation: vSoft .6s ease-out forwards; }
@keyframes vIn { from { opacity: 0; transform: scale(1.8) translateY(-6px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes vShake { 0%, 100% { translate: 0 0; } 25% { translate: calc(var(--r) * 2px) 1px; } 50% { translate: -1px calc(var(--r) * -2px); } 75% { translate: calc(var(--r) * -1.5px) -1px; } }
@keyframes vSoft { from { opacity: 0; transform: translateY(10px); filter: blur(8px); } to { opacity: .92; transform: none; filter: blur(.3px); } }
@keyframes vHop { 0% { opacity: 0; transform: translateY(12px) rotate(calc(var(--r) * 12deg)); } 70% { opacity: 1; transform: translateY(-3px); } 100% { opacity: 1; transform: rotate(calc(var(--r) * 4deg)); } }

/* ================= v5: locks that look like the real thing ================= */
.panel.lockpanel { background: none; border: 0; box-shadow: none; padding: 0; max-width: 400px; overflow: visible; }
.lock { position: relative; border-radius: 16px; padding: 16px 16px 14px; color: #f3e6c8;
  box-shadow: 0 30px 70px rgba(0, 0, 0, .75), 0 0 0 1px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .08); }

  background: linear-gradient(170deg, #e8c46a, #b8892e 45%, #8a6118 55%, #c99a3c); color: #2a1a06;
  box-shadow: inset 0 1px 0 rgba(255, 245, 200, .7), inset 0 -2px 3px rgba(60, 30, 0, .5), 0 3px 6px rgba(0, 0, 0, .5); }

.lock .plate::before { left: 6px; } .lock .plate::after { right: 6px; }

.lrow { display: flex; gap: 10px; margin-top: 8px; }
.lbtn { flex: 1; min-height: 46px; border-radius: 10px; font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: .02em; border: 0; }

.lbtn.go { color: #2a1a06; background: linear-gradient(170deg, #f1cf78, #c4932f 50%, #9a6a1c); box-shadow: inset 0 1px 0 rgba(255, 250, 210, .8), inset 0 -3px 0 rgba(80, 40, 0, .45), 0 4px 10px rgba(0, 0, 0, .5); }
.lbtn:active { transform: translateY(2px); }

/* rolling drums */
.drums { display: flex; gap: 10px; padding: 8px 10px; border-radius: 10px;
  background: linear-gradient(#0b0705, #1d130b 50%, #0b0705); box-shadow: inset 0 3px 8px rgba(0, 0, 0, .9), 0 1px 0 rgba(255, 220, 160, .18); }
.drum { position: relative; width: 56px; height: 104px; overflow: hidden; border-radius: 6px; touch-action: none; cursor: ns-resize;
  background: linear-gradient(90deg, #6a4a16, #e9c873 22%, #fff0b8 40%, #d4a845 62%, #7a5518); }
.drum .strip { position: absolute; left: 0; right: 0; top: 50%; transform: none; transition: transform .14s cubic-bezier(.2, .8, .3, 1.2); margin-top: -87.5px; }
.drum .strip span { display: grid; place-items: center; height: 35px; font-family: var(--font-display); font-weight: 800; font-size: 26px; color: rgba(50, 26, 4, .55); }

  background: linear-gradient(rgba(10, 6, 2, .85), rgba(10, 6, 2, 0) 30%, rgba(10, 6, 2, 0) 70%, rgba(10, 6, 2, .85)),
              linear-gradient(transparent 33%, rgba(80, 40, 0, .35) 33.5%, transparent 34.5%, transparent 65.5%, rgba(80, 40, 0, .35) 66%, transparent 66.5%); }
.drum .cu, .drum .cd { position: absolute; left: 0; right: 0; height: 18px; display: grid; place-items: center; pointer-events: none; }
.drum .cu { top: 0; } .drum .cd { bottom: 0; }
.drum svg { width: 16px; height: 16px; fill: none; stroke: rgba(255, 236, 190, .8); stroke-width: 3; stroke-linecap: round; }
.drums.letters .drum { width: 50px; }

/* the sideboard drawer: mahogany, brass, a pull handle */
.skin-drawer { background:
    repeating-linear-gradient(92deg, rgba(0, 0, 0, .0) 0 7px, rgba(0, 0, 0, .12) 7px 8px, rgba(0, 0, 0, 0) 8px 19px, rgba(255, 200, 150, .05) 19px 21px),
    linear-gradient(160deg, #6b2f1c, #4a1d10 45%, #5b2716 70%, #3a160b); }
.skin-drawer .face { background: linear-gradient(#5a2614, #3e170b); box-shadow: inset 0 0 0 3px #2a0f06, inset 0 0 0 5px rgba(255, 190, 120, .12), inset 0 6px 14px rgba(0, 0, 0, .6); transition: transform .5s cubic-bezier(.3, 1.4, .5, 1); }
.skin-drawer .pull, .skin-desk .pull { width: 18px; height: 54px; border-radius: 9px; background: linear-gradient(90deg, #7a5518, #f2d27c 40%, #a87a26); box-shadow: 0 2px 4px rgba(0, 0, 0, .6); }
.screw { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe9a8, #7a5518 70%); box-shadow: 0 1px 1px rgba(0, 0, 0, .6); }
.screw::after { content: ""; position: absolute; left: 1px; right: 1px; top: 4px; height: 1.2px; background: rgba(40, 20, 0, .7); transform: rotate(35deg); }

/* the store-room padlock: cold iron, rust, a shackle that jumps */
.skin-padlock { margin-top: 46px; background:
    radial-gradient(circle at 18% 24%, rgba(150, 60, 20, .45), transparent 22%), radial-gradient(circle at 82% 70%, rgba(130, 55, 15, .4), transparent 26%),

.skin-padlock .shackle { position: absolute; left: 50%; bottom: 100%; width: 150px; height: 56px; margin-left: -75px; margin-bottom: -10px; z-index: -1;

.skin-padlock .lbtn.go { background: linear-gradient(170deg, #d9dce0, #8f949b 50%, #5e6268); color: #121316; }

/* Papa's desk drawer: dark leather, gold tooling */
.skin-desk { background:
    radial-gradient(circle at 30% 20%, rgba(255, 255, 255, .05), transparent 40%), repeating-radial-gradient(circle at 70% 60%, rgba(0, 0, 0, .06) 0 2px, transparent 2px 5px),
    linear-gradient(160deg, #2d4434, #1b2b20 60%, #13201a); box-shadow: 0 30px 70px rgba(0, 0, 0, .75), inset 0 0 0 6px #10170f, inset 0 0 0 8px rgba(214, 170, 80, .55), inset 0 0 0 10px #10170f; }

/* the nursery's little door: painted wood, carved knobs */

    linear-gradient(90deg, transparent 0 10px, rgba(0, 0, 0, .25) 10px 12px, transparent 12px calc(100% - 12px), rgba(0, 0, 0, .25) calc(100% - 12px) calc(100% - 10px), transparent 0),

.knobs { display: flex; gap: 16px; }

  background: radial-gradient(circle at 38% 32%, #f0c98a, #b77a35 55%, #6a3c14); box-shadow: 0 5px 0 #4a2a0c, 0 8px 14px rgba(0, 0, 0, .55), inset 0 2px 2px rgba(255, 240, 200, .6); transition: transform .08s ease, box-shadow .08s ease; }

@media (prefers-reduced-motion: reduce) { .drum .strip { transition: none; } }

/* hiding: looking out through the gap under the drum lid */
#peek { position: absolute; inset: 0; z-index: 8; pointer-events: none; opacity: 0;
  background: linear-gradient(#000 0, #000 38%, rgba(0, 0, 0, .25) 44%, rgba(0, 0, 0, .1) 50%, rgba(0, 0, 0, .25) 56%, #000 62%, #000 100%); }
#peek::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 70% 14% at 50% 50%, transparent 40%, rgba(0, 0, 0, .7)); }
#peek.on { opacity: 1; }
/* "do not answer": an ear, a draining ring, and a warning */
#quiet { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 9; display: none; flex-direction: column; align-items: center; gap: 4px; text-align: center; pointer-events: none; }
#quiet.on { display: flex; animation: quietIn .3s ease-out; }
#quiet svg { width: 64px; height: 64px; fill: none; stroke: #ffd9c8; stroke-width: 2.4; stroke-linecap: round; filter: drop-shadow(0 0 8px rgba(200, 20, 20, .8)); }
#quiet .qr { stroke: #c0202a; stroke-width: 3; stroke-dasharray: 132; stroke-dashoffset: calc(132 * (1 - var(--q, 1))); transform: rotate(-90deg); transform-origin: 24px 24px; }
#quiet b { font-family: var(--font-display); font-weight: 800; font-size: 20px; color: #fff0e8; text-shadow: 0 0 3px #000, 0 0 16px rgba(190, 0, 0, .9); }
#quiet span { font-size: 15px; color: #ffd0c0; text-shadow: 0 1px 3px #000; }
@keyframes quietIn { from { opacity: 0; transform: translateX(-50%) scale(1.2); } to { opacity: 1; transform: translateX(-50%); } }

/* ================= v6: panels with a place in the house ================= */
/* the base panel: a dark board with an Ankara strip along the top */
.panel { border-radius: 8px; border: 0; background:
    linear-gradient(rgba(255, 255, 255, .025), rgba(0, 0, 0, .12)),

  background: radial-gradient(circle at 10px 5px, #f2c33d 3px, transparent 3.5px) 0 0 / 20px 10px, linear-gradient(90deg, #127a72 0 25%, #e2832a 25% 50%, #1d3a6b 50% 75%, #7a1f2b 75%) 0 0 / 80px 10px; }

.panel h2::after { content: ""; display: block; width: 96px; height: 8px; margin-top: 6px; opacity: .8;
  background: radial-gradient(circle, var(--ember) 2px, transparent 2.5px) 0 50% / 12px 8px repeat-x; }
/* buttons: painted signboards, not pills */

.seg button { font-family: var(--font-display); font-weight: 700; }
.seg button.on { background: #3a2c22; color: #ffd9a0; box-shadow: inset 0 -3px 0 var(--ember); }

/* journal: a Nigerian school exercise book */
.panel.book { background: #f3ecd8; color: #22314f; padding: 0 0 14px; max-width: 420px; box-shadow: 0 24px 60px rgba(0, 0, 0, .7), 6px 6px 0 #c8bea4, 7px 7px 0 #a89e84; }
.bk-cover { background: linear-gradient(135deg, #2f5fa8, #1e4a8c); color: #f2f2ea; padding: 14px 18px 12px; border-radius: 8px 8px 0 0; text-align: center; border-bottom: 3px solid #12305e; }

.bk-row { display: flex; gap: 8px; align-items: baseline; font-size: 13px; margin-top: 4px; text-align: left; }

.bk-page { margin: 0; padding: 14px 16px 6px 48px; background: repeating-linear-gradient(#f3ecd8 0 27px, #a9c4e6 27px 28px); background-position: 0 6px; position: relative; }

.book .jsec { color: #b03a2e; font-weight: 800; margin: 10px 0 4px; } .book .jsec small { color: #4a5a7a; }

.book .paper.memory { transform: rotate(-1.2deg); box-shadow: 0 2px 6px rgba(0, 0, 0, .25); position: relative; margin: 14px 0; }
.book .paper.memory::before { content: ""; position: absolute; top: -8px; left: 40%; width: 64px; height: 18px; background: rgba(230, 220, 170, .7); transform: rotate(-3deg); box-shadow: 0 1px 2px rgba(0, 0, 0, .15); }

.book .btn { background: #2f5fa8; color: #fff; }

/* hints: a folded note */
.panel.note { background: none; box-shadow: none; padding: 0; max-width: 360px; }
.fold { position: relative; padding: 20px 20px 16px; background:
    linear-gradient(180deg, rgba(0, 0, 0, 0) 49.5%, rgba(120, 90, 40, .22) 50%, rgba(0, 0, 0, 0) 51.5%),
    linear-gradient(90deg, rgba(0, 0, 0, 0) 49.6%, rgba(120, 90, 40, .14) 50%, rgba(0, 0, 0, 0) 51%), #ead9b0;

.fold::after { content: ""; position: absolute; right: 0; top: 0; border-width: 0 22px 22px 0; border-style: solid; border-color: #1a1420 #1a1420 #c9b68a #c9b68a; }

/* the pause menu: an old transistor radio */

    repeating-linear-gradient(92deg, rgba(0, 0, 0, 0) 0 9px, rgba(0, 0, 0, .14) 9px 10px, rgba(0, 0, 0, 0) 10px 23px, rgba(255, 200, 150, .05) 23px 25px),
    linear-gradient(160deg, #6b3a1f, #45230f 60%, #2e1609); border: 3px solid #1a0b04; padding: 14px 16px 16px; }

.dial { flex: 1; position: relative; border-radius: 8px; background: linear-gradient(#f3e6c4, #d9c79c); box-shadow: inset 0 2px 6px rgba(0, 0, 0, .5), 0 0 0 3px #2a1608; color: #3a2210; padding: 8px 10px 6px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }

  display: grid; place-items: center; padding: 0; cursor: pointer; background: rgba(12, 8, 12, .82); border: 1.5px solid rgba(236, 227, 210, .4); color: #ece3d2;
  box-shadow: 0 4px 16px rgba(0, 0, 0, .5); transition: transform .12s ease, background .15s ease; }

/* ================= v7: lanterns (lives) ================= */
#lives { display: flex; gap: 3px; flex: none; margin-left: 4px; }
#lives .lt { width: 13px; height: 18px; display: block; }

/* ================= v7: the smashed photograph ================= */
.skin-frame { background: radial-gradient(ellipse at 50% 40%, #2a1f17, #120c08 75%); }

.frame { position: relative; padding: 12px; border-radius: 4px;
  background: linear-gradient(135deg, #e3bd62, #8a6118 30%, #d8ac4c 52%, #7a5414 76%, #c99a3c);

  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .35); touch-action: manipulation; }
.ptile:active { filter: brightness(1.15); }
.frame .cracks { position: absolute; inset: 14px; pointer-events: none; opacity: .8; transition: opacity 1s ease;
  background:
    linear-gradient(28deg, transparent 49.6%, rgba(255, 255, 255, .55) 50%, transparent 50.4%),
    linear-gradient(-62deg, transparent 49.7%, rgba(255, 255, 255, .45) 50%, transparent 50.3%),
    linear-gradient(95deg, transparent 49.7%, rgba(255, 255, 255, .35) 50%, transparent 50.3%),

.vcard.used { opacity: .5; }
.lbtn.go:disabled { opacity: .45; filter: grayscale(.6); }

/* ================= v7: the radio ================= */
.skin-radio { background: linear-gradient(#5a3a22, #3a2416 60%, #2a190f); box-shadow: 0 30px 70px rgba(0, 0, 0, .75), inset 0 2px 0 rgba(255, 220, 170, .25), inset 0 -4px 0 rgba(0, 0, 0, .4); }

  background: repeating-linear-gradient(90deg, #6d5338 0 3px, #3d2b1b 3px 6px), #4a3624; box-shadow: inset 0 3px 8px rgba(0, 0, 0, .7); }

/* ================= v7: the mortar ================= */

@media (min-aspect-ratio: 5/4) and (min-height: 561px) {
  #app { max-width: none; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr); }

/* ================= v10: comic strips ================= */
#comic { position: fixed; inset: 0; z-index: 120; display: none; align-items: center; justify-content: center; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 34px max(12px, env(safe-area-inset-left, 0px));

#comic.pastmode { background: radial-gradient(ellipse at 50% 40%, #2a1e12, #0c0806 75%); }
.cpage { display: grid; gap: 10px; width: 100%; height: 100%; max-width: 1200px; transition: opacity .16s ease; }
.cpage.turn { opacity: 0; }
.cpage.n1 { grid-template-columns: 1fr; }
.cpage.n2 { grid-template-rows: 1fr 1fr; }
.cpage.n3 { grid-template-rows: 1fr 1fr 1fr; }
@media (orientation: landscape) { .cpage.n2 { grid-template-rows: none; grid-template-columns: 1fr 1fr; } .cpage.n3 { grid-template-rows: none; grid-template-columns: 1.1fr 1fr 1fr; } }
.cpanel { position: relative; margin: 0; overflow: hidden; background: #0b0807; border: 3px solid #f2ead8; outline: 3px solid #120c08; box-shadow: 0 10px 30px rgba(0, 0, 0, .7);
  opacity: 0; transform: scale(.96) rotate(-.4deg); transition: opacity .35s ease, transform .5s cubic-bezier(.2, .9, .3, 1.1); min-height: 0; }
.cpanel:nth-child(2) { transform: scale(.96) rotate(.5deg); }
.cpanel.in { opacity: 1; transform: none; }
.cpanel svg, .cpanel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.cpanel.past svg, .cpanel.past img { filter: sepia(.55) saturate(.85) contrast(.95) blur(.25px); }
.cpanel.past::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(40, 20, 6, .55)); mix-blend-mode: multiply; }
.ccap { position: absolute; left: 8px; top: 8px; z-index: 2; max-width: 70%; padding: 5px 9px; background: #f2dc8e; color: #1a120a; border: 2px solid #120c08;
  font-family: var(--font-body); font-weight: 700; font-size: clamp(11px, 1.6vw, 14px); letter-spacing: .02em; text-transform: uppercase; box-shadow: 2px 2px 0 #120c08; }
.cpanel.past .ccap { background: #e8c890; }
.cbal { position: absolute; z-index: 3; max-width: 58%; padding: 7px 10px 8px; border-radius: 14px; background: #fbf7ee; color: #120c08; border: 2px solid #120c08;
  font-family: var(--font-body); font-size: clamp(12px, 1.7vw, 15.5px); line-height: 1.28; box-shadow: 2px 3px 0 rgba(0, 0, 0, .35);
  opacity: 0; transform: translateY(6px) scale(.94); }
.cpanel.in .cbal { animation: balIn .3s ease-out forwards; animation-delay: var(--d, .35s); }
.cbal b { display: block; font-size: .72em; letter-spacing: .08em; text-transform: uppercase; color: #8a2a1a; margin-bottom: 1px; }
.cbal.ojuju { background: #0a0606; color: #f4ece0; border-color: #8a1010; border-radius: 4px; font-family: var(--font-display); font-weight: 800; font-size: clamp(22px, 4vw, 40px); letter-spacing: .1em;
  text-shadow: 0 0 12px rgba(200, 20, 20, .9); box-shadow: 0 0 24px rgba(160, 10, 10, .6); }
@keyframes balIn { to { opacity: 1; transform: none; } }
.csfx { position: absolute; right: 6%; bottom: 10%; z-index: 2; font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 6vw, 58px); color: #ffd23a; transform: rotate(-8deg);

.cskip { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); z-index: 5; min-height: 38px; padding: 0 16px; border-radius: 99px;

@keyframes nextPulse { 50% { opacity: .35; } }
@media (orientation: portrait) { .cbal { max-width: 78%; } }
@media (prefers-reduced-motion: reduce) { .cpanel, .cbal, .csfx { animation: none !important; transition: none !important; opacity: 1 !important; transform: none !important; } }

#runTimer { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 6; display: none;

/* ================= OIL PAINTINGS, WITH MOODS ================= */
/* Every painting in the house is oil on canvas: brush strokes that follow the forms, the weave of the canvas,
   yellowed varnish and fine cracks. Each has two moods, and the house switches them as the night goes on:
   Mama (tired smile → eyes closed), Papa (proud → terrified), the family in 1972 (the driver painted out →
   the driver back), Mama and small Tobi (tender → weeping), the wedding (laughing → turned away). */
(() => {
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

    for (let i = 0; i < w * h / 26; i++) {                       // brush strokes that follow a gentle flow
      const x = r() * w | 0, y = r() * h | 0, k = (y * w + x) * 4;
      const a = Math.sin(x * .045) * 1.3 + Math.cos(y * .035) * 1.1 + (r() - .5) * .8, len = 3 + r() * 8;
      g.strokeStyle = `rgba(${d[k]},${d[k + 1]},${d[k + 2]},${.45 + r() * .3})`; g.lineWidth = 1.6 + r() * 3.2;
      g.beginPath(); g.moveTo(x - Math.cos(a) * len / 2, y - Math.sin(a) * len / 2); g.lineTo(x + Math.cos(a) * len / 2, y + Math.sin(a) * len / 2); g.stroke();
    }
    for (let i = 0; i < w * h / 260; i++) {                      // a few thick lit ridges of paint
      const x = r() * w, y = r() * h;
      g.strokeStyle = `rgba(255,248,230,${.05 + r() * .06})`; g.lineWidth = 1; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 3 + r() * 5, y + (r() - .5) * 3); g.stroke();

/* Adeleke House, Oke-Ọla, a Yoruba hill town.
   1935  Olumide Adeleke born. Self-made: transport, then contracts.
   1947  Adaeze born in Enugu. A teacher.
   1970  They marry, after the war.
   1971  2 March: Tobenna Oluwaseun Adeleke born.
   1972  The house is built at the top of the hill, with a chimney nobody in Nigeria needs.
   1973  Effiong Etim, 22, from Calabar, becomes Papa's driver. His grandfather was an Ekpo elder in Ikot Ekpene.
   1975  The cement import contracts: ships of cement paid for and never delivered. Land on the hill road "acquired".
         19 Sept: a labourer dies on one of the plots. 3 Oct: Effiong says he will talk. 7 Oct: Effiong is gone;
         that night Papa "fixes the chimney". 14 Oct, 7:20 pm: the thing the children call Ojuju Calabar comes
         for Papa. He is found at the foot of the chimney, alive, and never wakes. Every clock stops at 7:20.
         Mama runs down the hill in the rain with Tobi, four.
   1994  Mama moves to the UK. Tobi studies engineering at UNILAG.
   1997  Monday 13 Oct: a NITEL mast project sends Tobi, 26, to Oke-Ọla. Tuesday 14 Oct: twenty-two years to the night.
   Why "Ojuju Calabar": Effiong came back the way his forefathers' spirits come back: as Ekpo, in raffia, with a dark
   carved face. Nobody on the hill had ever seen Ekpo. To them he was "the Calabar man", so the children named the
   thing Ojuju Calabar. It is not evil for its own sake. It wants its name back, and a burial. */

"One bottle rattles. You tip it, and a small key slides out into your palm on a trickle of old schnapps.": "One bottle dey shake. You tilt am, and small key slide enter your palm with small old schnapps.",
"A black iron key, heavier than it looks. Two letters are scratched into the bow: A. A. Mama’s key.": "Black iron key, e heavy pass how e be. Dem scratch two letters for the head: A. A. Na Mama key.",
"You fold Mama’s white altar cloth and take it. Somebody in this house deserves to be covered with something clean.": "You fold Mama white altar cloth and carry am. Somebody for this house deserve make dem cover am with something clean.",
"A coil of rope, thick as your wrist. Mama’s rope for the roof hatch, the way up to their bedroom.": "Rope wey thick like your wrist. Mama rope for the roof hatch, the way to go their bedroom.",
"Effiong’s old Grundig valve radio. When you touch the knob, the valves begin to glow.": "Effiong old Grundig radio. When you touch the knob, the valves begin shine.",
"The harmonium": "The harmonium",
"The harmonium coughs. Dust sifts out of the bellows.": "The harmonium cough. Dust dey comot from the bellows.",
"Scratched into the metal: THE NIGHT SHE RAN. Day, then month: _ _ / _ _": "Dem scratch am for the metal: THE NIGHT SHE RAN. Day first, then month: _ _ / _ _",
"Mama’s oil painting above the TV is missing something at her throat.": "Mama oil painting wey dey on top the TV, something no dey her neck.",
"Select the coral beads in your tray, then tap the painting.": "Select the coral beads for your tray, then tap the painting.",
"Something is hidden behind the painting.": "Something hide behind the painting.",
"You will want fire later. Search Papa’s agbada on the stand by the door.": "You go need fire later. Search Papa agbada for the stand near the door.",
"Select the iron key, then tap the hall door.": "Select the iron key, then tap the hall door.",
"Select the boys’ quarters key, then tap that door.": "Select the boys’ quarters key, then tap that door.",
"Tap the red toolbox. Keep what is in it: you will need the hammer much later.": "Tap the red toolbox. Keep wetin dey inside: you go need the hammer later-later.",
"The long crate on the right is nailed shut.": "The long crate for right side, dem nail am shut.",
"Select the crowbar, then tap the crate.": "Select the crowbar, then tap the crate.",
"The voice said: in the bottles Oga poured for the dead, and never drank.": "The voice talk: inside the bottles wey Oga dey pour for the dead, and e no dey drink.",
"Papa in the blue fila: “What is mine stays mine.” Mama in the green gele sang the lullaby. Effiong, with small Tobi on his shoulders, called him “my small driver”.": "Papa wey wear blue fila: “What is mine stays mine.” Mama wey tie green gele na she sing the lullaby. Effiong, wey carry small Tobi for him shoulder, call am “my small driver”.",
"Something was once written under the Sacred Heart picture. The candlelight might bring it out.": "Dem write something before under the Sacred Heart picture. Candle light fit show am.",
"The harmonium on the east wall takes three symbols, like the little door in Tobi’s room.": "The harmonium for the east wall dey take three symbols, like the small door for Tobi room.",
"Before you go up: Mama’s white cloth on the prayer table. Somebody will need covering tonight.": "Before you go up: Mama white cloth dey the prayer table. Somebody go need cover tonight.",
"Tap the prayer table until you take the white cloth.": "Tap the prayer table until you carry the white cloth.",
"Behind the boards there are burglary-proof bars, with a four-number padlock: the night she ran, day and month.": "Behind the planks, burglary-proof bars dey, with padlock wey get four numbers: the night wey she run, day and month.",
"You have seen that night twice: circled on the calendar in the Living Room, and on the last page of Papa’s diary.": "You don see that night two times: dem circle am for the calendar for Living Room, and for the last page of Papa diary.",
"Run to the chimney at the far end of the roof. Do not stop, and do not let him reach you.": "Run go the chimney for the end of the roof. No stop, and no let am reach you.",
"Go round the black water tank and the loose zinc sheet. Walk straight up to the bricks.": "Pass round the black water tank and the loose zinc. Waka straight reach the bricks.",
"The bricks at the bottom of the chimney are newer than the rest.": "The bricks for the bottom of the chimney new pass the rest.",
"Select the mason’s hammer, then tap the chimney. Keep tapping.": "Select the mason hammer, then tap the chimney. Continue to tap.",
"He deserves to be covered with something clean.": "E deserve make dem cover am with something clean.",
"Select Mama’s white cloth, then tap the opening in the chimney.": "Select Mama white cloth, then tap the hole for the chimney.",
"Give him back his name. It was on the card in the boys’ quarters.": "Give am back him name. E dey the card for the boys’ quarters.",
"Tap the chimney and say his name: Effiong Etim.": "Tap the chimney and call him name: Effiong Etim.",
"The Living Room": "The Living Room",
"Gold trim, lace on everything, a box television, oil paintings in heavy frames. Every door behind you has slammed. Every clock you can see says twenty past seven. All but one.": "Gold for everywhere, lace on top everything, box TV, oil paintings for heavy frames. All the doors behind you don slam. Every clock wey you see talk twenty past seven. All except one.",
"Tobi’s Room": "Tobi Room",
"You slept here once.": "You don sleep here before.",
"Pale blue paint, a cot, a rocking horse. You have never seen this room in your life, and your hand still goes straight to the light switch.": "Light blue paint, one cot, one rocking horse. You never see this room for your life, but your hand still go straight to the light switch.",
"Mama’s Kitchen": "Mama Kitchen",
"Somebody is still waiting for food.": "Somebody still dey wait for food.",
"Tiles, enamel pots, a gas cooker gone cold. The back door to the boys’ quarters is nailed shut. The kettle ticks as it cools, though nothing has been lit here in twenty-two years.": "Tiles, enamel pots, gas cooker wey don cold. Dem nail the back door wey go the boys’ quarters. The kettle dey tick as e dey cool, even though nobody light anything here for twenty-two years.",
"The Boys’ Quarters": "The Boys’ Quarters",
"He slept here. Bring a light.": "Na here e dey sleep. Carry light.",
"Effiong’s old room behind the house, turned into a store: cement bags gone hard as stone, Papa’s crates, and no light at all. Something drips. Feel along the walls for something to light.": "Effiong old room behind the house, wey dem turn to store: cement bags wey don strong like stone, Papa crates, and light no dey at all. Something dey drip. Touch the walls, find something wey you fit light.",
"Papa’s Office": "Papa Office",
"He kept two of everything.": "E keep two of everything.",
"Mama’s Prayer Room": "Mama Prayer Room",
"She prayed for a way out.": "She pray for way to comot.",
"Benches, an old harmonium, coloured glass. The kneeler is worn through at one end. High up, a square hatch is shut tight.": "Benches, old harmonium, coloured glass. The kneeler don tear for one side. For up, one square hatch close tight.",
"The Master Bedroom": "The Master Bedroom",
"The window to the roof.": "The window wey go the roof.",
"Up the ladder, under the roof: the room your parents slept in. Camphor, old powder, a dusty mirror. Past the candles, a boarded window shows one thin line of grey.": "Up the ladder, under the roof: the room wey your papa and mama dey sleep. Camphor, old powder, dusty mirror. Past the candles, one window wey dem nail with planks dey show small line of grey.",
"The Roof": "The Roof",
"Give him back his name.": "Give am back him name.",
"Cold zinc underfoot, all of Oke-Ọla asleep below. At the far end of the roof, the brick chimney nobody ever lit. Behind you, the window you came out of.": "Cold zinc under your leg, the whole Oke-Ọla dey sleep for down. For the end of the roof, the brick chimney wey nobody ever light. Behind you, the window wey you comot.",
"The crate lid lifts by itself. Something long and grey, in a raffia fringe, unfolds out of it. HIDE. The blue water drum in the corner.": "The crate cover lift by himself. Something long and grey, with raffia, unfold comot from inside. HIDE. The blue water drum for the corner.",
"The chimney. Up close, the bricks at the bottom are newer than the rest, and the mortar is a different colour. Behind you, he slows down. He is watching what you do.": "The chimney. When you near am, the bricks for the bottom new pass the rest, and the cement get different colour. Behind you, e don slow down. E dey watch wetin you dey do.",
"Get to the chimney first.": "Reach the chimney first.",
"The bricks are already out.": "The bricks don already comot.",
"The bricks fall inward. Inside, wrapped in a faded Ankara wrapper, someone small and dry and very still. A driver’s cap rests on top.": "The bricks fall enter inside. Inside, inside old Ankara wrapper wey don fade, somebody small, dry, and very quiet. One driver cap dey on top.",
"Not yet. The bricks first.": "No be now. The bricks first.",
"You lay Mama’s white cloth over him, gently, the way she would have. Behind you, he has stopped moving.": "You spread Mama white cloth cover am, gently, the way she for do am. Behind you, e don stop to move.",
"Behind you, the window glass breaks outward again. He is coming. Back to the chimney.": "Behind you, the window glass break again. E dey come. Go back to the chimney.",
"Behind you, the window glass breaks outward. It is climbing onto the roof. RUN for the chimney.": "Behind you, the window glass break. E dey climb come the roof. RUN go the chimney.",
"Crack. Old cement, badly mixed in the dark. Again.": "Krak. Old cement, wey dem mix anyhow for dark. Again.",
"A brick moves. Something inside smells of dust and camphor. Again.": "One brick shift. Something inside dey smell of dust and camphor. Again.",
"Far below in Oke-Ọla, a talking drum, and a small bell. Then nothing at all.": "Far for down for Oke-Ọla, talking drum, and small bell. Then nothing at all.",
"Three slow knocks on the door you came in by. From the outside. Then a voice, very close.": "Three slow knocks for the door wey you take enter. From outside. Then one voice, very near.",
"A small giggle, from the cot. Then a whisper: vroom, vroom.": "Small laugh, from the cot. Then one whisper: vroom, vroom.",
"In the oil painting, Papa’s eyes have turned to follow you.": "For the oil painting, Papa eyes don turn dey follow you.",
"The Boys’ Quarters and Papa’s Office": "The Boys’ Quarters and Papa Office",
"The house snaps back around you. Cold. Twenty past seven.": "The house snap back round you. Cold. Twenty past seven.",

"Long fingers close on your shoulder. His breath puts out your lantern.": "Long fingers hold your shoulder. Him breath quench your lantern.",

"You moved. He heard you. He crosses the room in three long steps.": "You move. E hear you. E cross the room with three long steps.",

"Downstairs": "Downstairs",

"Upstairs": "Upstairs",
"Footsteps in the passage outside. Slow. Heavy.": "Footsteps for the passage outside. Slow. Heavy.",
"Bare feet on the terrazzo outside the door, coming closer.": "Bare leg for the terrazzo outside the door, e dey come near.",
"Something walks the passage. Each step is a long time after the last.": "Something dey waka for the passage. Each step dey take long before the next one.",
"They stop outside the door. Something breathes in, slowly. Then they go on.": "Dem stop for outside the door. Something breathe in, slow. Then dem continue to waka.",
"Footsteps in the passage, coming straight for this door.": "Footsteps for the passage, dem dey come straight for this door.",
"He is in the room": "E don enter the room",
"Keep still. Don’t touch anything.": "No move. No touch anything.",

"The mortar": "The mortar",

"Tap the mortar to pound. Leave a breath between the groups.": "Tap the mortar to pound. Rest small between each group.",
"Listen": "Listen",

"From the dark beside you, someone else is pounding…": "For the dark near you, another person dey pound…",

"The pestle drags in your hands. Not like that.": "The pestle dey heavy for your hand. No be like that.",
"Smooth, not lumpy. Behind you, a latch lifts.": "E smooth, e no get lump. Behind you, one latch lift.",

"The yam in the mortar is smooth now. Nobody is pounding any more.": "The yam for the mortar don smooth. Nobody dey pound again.",
"The pantry door is latched from the inside, which should not be possible. Somewhere close, someone is waiting for food.": "Dem lock the pantry door from inside, and e no suppose possible. Somewhere near, somebody dey wait for food.",
"Flour, gone grey and solid.": "Flour, e don grey and strong like stone.",
"Salt, wept into one damp lump.": "Salt, e don cry turn one wet lump.",
"Sugar. Ants got into it decades ago and never left.": "Sugar. Ants enter am since many years, dem no comot.",
"Lipton tea, the yellow label faded white.": "Lipton tea, the yellow label don fade turn white.",
"Rice, crawling with weevils so old they are dust.": "Rice, weevils full am, dem don old turn dust.",
"The radio": "The radio",
"An old Grundig valve radio. When you touch the knob, the valves begin to glow.": "Old Grundig radio. When you touch the knob, the valves begin shine.",
"Drag the dial or turn the knob. Listen for a voice.": "Drag the dial or turn the knob. Listen for voice.",
"Turn it off": "Off am",
"Only static now. Whoever was speaking has gone.": "Na only static now. Whoever dey talk don go.",
"Something boxy on the bench, with a glass face. It is too dark to make out.": "Something wey be like box dey the bench, e get glass face. E too dark to see am well.",
"A small padlock on the chain, with a tiny keyhole. No numbers, no dials. Just a keyhole.": "Small padlock for the chain, with small keyhole. No number, no dial. Na only keyhole.",
"A small padlock with a tiny keyhole. Her voice said she hid the key where he never looked.": "Small padlock with small keyhole. Her voice talk say she hide the key where e no dey ever look.",
"The little key turns. The padlock drops open on its chain.": "The small key turn. The padlock open, e hang for the chain.",
"Schnapps bottles for pouring libation, never opened. One label has been scratched to read: HER TEARS. One bottle rattles when you touch it.": "Schnapps bottles for pouring libation, nobody open dem. Dem scratch one label make e read: HER TEARS. One bottle dey shake when you touch am.",

"The bottle marked HER TEARS rattles. You tip it, and a small key slides out into your palm on a trickle of old schnapps.": "The bottle wey dem mark HER TEARS dey shake. You tilt am, and small key slide enter your palm with small old schnapps.",

"The record player": "The record player",
"A party, recorded in this house. Three voices come up out of the crackle. Who said what?": "Party wey dem record for this house. Three voices dey come out from the noise. Who talk wetin?",
"Tap a voice to play it, then tap who said it.": "Tap one voice make e play, then tap the person wey talk am.",

"Play the record through when you are sure.": "Play the record finish when you sure.",
"Play it through": "Play am finish",
"The needle skips. A man’s voice, very close: “No. That is not who she was.”": "The needle jump. One man voice, very near: “No. No be who she be.”",

"Scratched into the metal: THE NIGHT SHE LET GO. Day, then month: _ _ / _ _": "Dem scratch am for the metal: THE NIGHT SHE LET GO. Day first, then month: _ _ / _ _",

"The mortar and pestle stand by the barred window. Someone is waiting for food.": "Mortar and pestle dey near the window wey get bars. Somebody dey wait for food.",

"Tap the old radio on the workbench and tune it slowly. Listen for the static to clear.": "Tap the old radio for the workbench, tune am slowly. Listen make the noise clear.",
"Drag the dial until the hiss fades and music comes through, then hold it there.": "Drag the dial until the hiss reduce and music come out, then hold am there.",
"The voice said: in the bottles he poured for the dead, and never drank.": "The voice talk: inside the bottles wey e pour for the dead, and e no ever drink.",
"Tap the schnapps bottles on the rack by the right-hand wall.": "Tap the schnapps bottles for the rack near the right wall.",
"Select the small key, then tap the padlock on the door.": "Select the small key, then tap the padlock for the door.",
"A small framed photo stands on the desk. Its glass is smashed.": "Small photo frame dey the desk. The glass don break.",
"Tap the photo, then tap each piece to turn it until the picture is the right way up.": "Tap the photo, then tap each piece make e turn until the picture stand well.",
"Look for the faces and the ground. Every face should sit above its body, and the ground at the bottom.": "Look the faces and the ground. Every face suppose dey on top of the body, and the ground for down.",
"Now the record player in the corner might make sense.": "Now the record player for the corner fit make sense.",
"Tap the record player. Match each voice to the person in the photo who said it.": "Tap the record player. Match each voice with the person for the photo wey talk am.",
"The man in the red chief’s cap: “What is mine stays mine.” The woman in the green gele sang the lullaby. The young woman holding the baby waited under the mango tree.": "The man wey wear red chief cap: “What is mine stays mine.” The woman wey tie green gele sing the lullaby. The young woman wey carry baby wait under the mango tree.",
"A small matchbox. Damp, but a few sticks still strike.": "Small matchbox. E don damp, but some sticks still dey strike.",
"A string of red coral beads, cold as river water.": "Red coral beads wey cold like river water.",
"Heavy and rusted. It fits something big.": "E heavy and e don rust. E go fit big door.",
"Four holes, with a little thread still on it.": "Four holes, small thread still dey inside.",
"Small and brass, shaped like a butterfly.": "Small brass key, e be like butterfly.",
"Strip of wrapper": "Wrapper piece",
"A strip of old Ankara cloth. Good for wiping.": "Small piece of old Ankara cloth. E good for clean-clean.",
"Cold iron with a claw for nails.": "Cold iron wey get claw for nail.",
"Warm to the touch. Too warm.": "E hot for hand. E too hot.",
"Store key": "Store key",
"Iron, cold, and smaller than you expected.": "Iron, cold, and e small pass wetin you expect.",
"Blackened iron. A name is scratched down the shaft: ARIT.": "Black iron. Dem scratch name for body: ARIT.",
"Coarse and heavy. One end is frayed where it was cut.": "E rough and heavy. One side don tear where dem cut am.",
"I remember everything": "I don remember everything",
"That is all of it. Every page. Now get out, and tell her you know.": "Na everything be that. Every page. Now comot for here, and tell am say you know.",
"Pull the drawer": "Pull the drawer",
"Nothing. The dials just click.": "Nothing. The dials just dey click.",
"Pull the shackle": "Pull the padlock",
"The padlock does not move. Rust grinds in it.": "The padlock no gree shift. Rust dey grind inside.",
"Open the drawer": "Open the drawer",
"Nothing. The wheels just click.": "Nothing. The wheels just dey click.",
"The lock stays shut. A small voice giggles.": "The lock no open. Small pikin dey laugh somewhere.",
"There is a scrap of paper on top of the television, on the lace cover.": "Paper dey on top the television, for the lace cover.",
"The TV stands against the left wall. Walk up and tap the top of it.": "The TV dey stand for left wall. Waka reach am, tap the top.",
"Tap the paper on the TV. It points at the clock.": "Tap the paper for the TV. E dey point to the clock.",
"The note links the clock and the drawer.": "The note join the clock and the drawer together.",
"Read the standing clock on the wall opposite the TV. Where did the hands stop?": "Read the standing clock wey dey opposite the TV. Where the hand stop?",
"Seven, twenty. Set the three dials on the sideboard drawer to 7 2 0.": "Seven, twenty. Turn the three dials for the drawer to 7 2 0.",
"Something red is in the open drawer.": "Something red dey inside the drawer wey don open.",
"Tap the coral beads inside the drawer.": "Tap the coral beads inside the drawer.",
"Mama’s portrait above the TV is missing something at her throat.": "Mama portrait wey dey above the TV dey miss something for her neck.",
"Select the coral beads in your tray, then tap the portrait.": "Choose the coral beads for your tray, then tap the portrait.",
"Something is hidden behind the portrait.": "Something hide for back of the portrait.",
"Tap the key in the open compartment.": "Tap the key inside the hole wey open.",
"You will want fire later. Search Papa’s agbada on the stand by the front door.": "You go need fire later. Check Papa agbada wey hang near the front door.",
"Tap the agbada.": "Tap the agbada.",
"You have the key. Where does it fit?": "You don get the key. Where e go enter?",
"Select the iron key, then tap the front door.": "Choose the iron key, then tap the front door.",
"The rocking horse moves by itself. Walk up to it and look closely.": "The rocking horse dey move by himself. Waka near am, look am well.",
"Tap the horse by the right-hand wall. Something is caught in its mane.": "Tap the horse for the right-hand wall. Something hook for him hair.",
"The teddy bear on the toy shelf is missing an eye.": "The teddy bear for the toy shelf don lose one eye.",
"Select the button, then tap the teddy.": "Choose the button, then tap the teddy.",
"The music box on the dresser needs winding.": "The music box for the dresser need make you wind am.",
"Select the wind-up key, then tap the music box.": "Choose the wind-up key, then tap the music box.",
"Watch the symbols light up: star, moon, sun.": "Watch how the signs go light: star, moon, sun.",
"The little door on the far wall takes three symbols in order.": "The small door for the far wall dey take three signs, one by one.",
"Tap the door and enter what the music box played.": "Tap the door, put wetin the music box play.",
"Star, then moon, then sun.": "Star, then moon, then sun.",
"The matches in your tray are for the gas cooker. It has been cold a long time.": "The matches for your tray na for the gas cooker. E don cold since.",
"Select the matches, then tap the cooker on the left. Then you will be able to read the jar labels.": "Choose the matches, then tap the cooker for left. After that you go fit read the jar labels.",
"There is a card pinned to the wall beside the low door on the right.": "One card hang for wall near the small door for right.",
"Walk up and tap the card. It is a recipe, and the order matters.": "Waka go tap the card. Na recipe, and the arrangement matter.",
"Five jars stand on the dresser by the left wall. Three of them are in the recipe.": "Five jars dey for the dresser near the left wall. Three of them dey inside the recipe.",
"Tap the jars in the recipe’s order. A wrong jar starts you over.": "Tap the jars the way the recipe arrange am. If you tap wrong one, you go start again.",
"Flour, then salt, then sugar.": "Flour, then salt, then sugar.",
"The pantry door by the cooker is open. Look inside.": "The pantry door near the cooker don open. Look inside.",
"Tap the key hanging on the nail.": "Tap the key wey hang for the nail.",
"The key fits the low wooden door in the right-hand wall.": "The key go enter the small wooden door for the right-hand wall.",
"Select the store key, then tap that door.": "Choose the store key, then tap that door.",
"It is too dark to do much. Look for a bush lamp on a nail beside the heavy door.": "E too dark to do anything. Find bush lamp wey hang for nail near the heavy door.",
"Select the matches, then tap the bush lamp. Then you can carry the light.": "Choose the matches, then tap the bush lamp. Then you fit carry the light.",
"Search the workbench along the left wall.": "Check the workbench for the left wall.",
"Tap the red toolbox.": "Tap the red toolbox.",
"The coffin on the right is nailed shut.": "Dem nail the coffin for right shut.",
"Select the crowbar, then tap the coffin.": "Choose the crowbar, then tap the coffin.",
"The brass key fits the big keyhole in the door.": "The brass key go enter the big keyhole for the door.",
"Select the brass key, then tap the keyhole.": "Choose the brass key, then tap the keyhole.",
"Three numbers are painted on the walls. The scrap beside the door says how to read them.": "Dem paint three numbers for the walls. The paper near the door talk how to read dem.",
"Left wall: 5. Door wall: 2. Right wall: 9.": "Left wall: 5. Door wall: 2. Right wall: 9.",
"Enter 5 2 9 on the padlock.": "Put 5 2 9 for the padlock.",
"Both locks are done. Tap the door.": "The two locks don open. Tap the door.",
"It is very dark in here. A hurricane lamp stands on the desk.": "E dark well-well here. Hurricane lamp dey for the desk.",
"Select the matches, then tap the lamp.": "Choose the matches, then tap the lamp.",
"A small framed photo stands on the desk. Read what is written on it.": "Small photo frame dey for the desk. Read wetin dem write for am.",
"Tap the small framed photo. It names someone.": "Tap the small photo. E call somebody name.",
"The desk drawer on your side has four brass letter wheels.": "The desk drawer for your side get four brass letter wheels.",
"The photo named a girl. Her name has four letters.": "The photo call one girl name. Her name get four letters.",
"A, R, I, T.": "A, R, I, T.",
"The drawer is open. Something dark lies inside.": "The drawer don open. Something black dey inside.",
"Tap the black key.": "Tap the black key.",
"An iron-banded door stands in the north wall, to the right of the bookcase.": "Iron door dey for the north wall, for right side of the bookcase.",
"Select the black key, then tap that door.": "Choose the black key, then tap that door.",
"It is dim. Two candles stand on the prayer table.": "E dim for here. Two candles dey for the prayer table.",
"Select the matches, then tap a candle.": "Choose the matches, then tap one candle.",
"Something was once written on the north wall, to the left of the window. The candlelight might bring it out.": "Somebody write something for the north wall before, for left side of the window. Candle light fit show am.",
"Walk up to the wall and tap the red letters. They say SING IT BACK.": "Waka reach the wall, tap the red letters. E talk SING IT BACK.",
"The organ on the east wall takes three symbols, like the little door in the nursery.": "The organ for the east wall dey take three signs, like the small door for the children room.",
"Think of the lullaby: star, moon, sun. The wall said to sing it back.": "Remember the song: star, moon, sun. The wall talk make you sing am back.",
"Backwards: sun, moon, star.": "Backwards: sun, moon, star.",
"Something clicked open on the east wall, nearer the door. A small cupboard.": "Something open for the east wall, near the door. Small cupboard.",
"Tap the rope inside the cupboard.": "Tap the rope inside the cupboard.",
"There is a hatch in the ceiling. Look up. An iron ring hangs from it, out of reach.": "Hatch dey for the ceiling. Look up. Iron ring hang for am, your hand no fit reach.",
"Select the rope, then tap the hatch.": "Choose the rope, then tap the hatch.",
"A ladder hangs open. Tap the hatch to climb.": "Ladder don drop. Tap the hatch to climb.",
"The tall mirror is caked in dust. You need cloth.": "Dust don cover the long mirror. You need cloth.",
"Tap the Ankara wrapper on the right-hand side to tear off a strip.": "Tap the Ankara wrapper for right side, tear one piece.",
"Select the strip of wrapper, then tap the mirror.": "Choose the wrapper piece, then tap the mirror.",
"Tap the clean mirror and read what it shows.": "Tap the clean mirror, read wetin e show.",
"Light the four candles on the table under the window with the matches.": "Light the four candles for the table under the window with the matches.",
"Bone is white, blood is red, the sea is blue, the grave is green.": "Bone na white, blood na red, sea na blue, grave na green.",
"The order is white, red, blue, green.": "The arrangement na white, red, blue, green.",
"Wait a moment while the boards fall away.": "Wait small make the boards fall comot.",
"Behind the boards there are burglary-proof bars, with a four-number padlock: the night she let go, day and month.": "Behind the boards, burglary-proof dey, with padlock wey take four numbers: the night wey she let go, day and month.",
"You have seen that night twice: circled on the calendar in the Parlour, and at the top of Papa’s diary.": "You don see that night two times: dem circle am for the calendar for Parlour, and e dey top of Papa diary.",
"14 October: 1 4 1 0.": "14 October: 1 4 1 0.",
"Tap the window to climb out onto the roof.": "Tap the window, climb comot go the roof.",
"Run to the mango tree at the far end of the roof. Do not stop, and do not let it reach you.": "Run go the mango tree for the end of the roof. No stop, no let am reach you.",
"Go round the black water tank and the loose zinc sheet. Walk straight into the branch.": "Pass round the black water tank and the zinc wey loose. Waka straight enter the branch.",
"Too far away. Walk closer.": "E too far. Waka come near.",
"Nothing there. Turn until the dot glows on something.": "Nothing dey there. Turn until the dot shine for something.",
"Your phone was struggling, so the graphics are now set to Low. You can change this in the menu.": "Your phone dey struggle, so we don set the graphics to Low. You fit change am for the menu.",
"A lullaby begins. Three symbols light up in turn.": "One song start. Three signs light one by one.",
"The box plays its three notes again.": "The box play the three notes again.",
"A star, a moon, a sun. You write it down.": "Star, moon, sun. You write am down.",
"Both locks give. The door swings open on cold air, and a stair that climbs toward lamp oil and leather.": "The two locks open. The door swing open, cold air, and stairs wey climb go where kerosene and leather dey smell.",
"The flames gutter and die at once. A cold breath on your neck.": "All the flames quench one time. Cold breath touch your neck.",
"All four flames stand straight, then lean toward the window. She is there in her green gele, pale and tired. She smiles at you, and fades.": "The four flames stand straight, then dem bend go the window. She dey there for her green gele, pale and tired. She smile for you, then she disappear.",
"The boards fall away on their own. Cold air, and the smell of morning. Climb out.": "The boards fall comot by themselves. Cold air, and morning smell. Climb comot.",
"A glass jar. The label is too faded to make out in this light.": "Glass jar. The label don fade, you no fit read am for this light.",
"The third jar settles with a click. Beside the range a latch springs, and the pantry door swings open by itself.": "The third jar sit down with click. Near the cooker, one latch jump, and the pantry door open by himself.",
"The jars rattle in a row. A cold voice at your ear.": "The jars shake for line. Cold voice for your ear.",
"Not yet. It is still out there.": "No be now. E still dey outside.",
"Heavy white cloth, stiff with embroidery. In the deep pocket: a matchbox. The tailor’s tag inside the neck says: CHIEF O. EKPO.": "Heavy white cloth, plenty embroidery. Inside the big pocket: matchbox. The tailor tag for the neck talk: CHIEF O. EKPO.",
"Lint, an old Naira note, and cold air. Nothing else in the pockets.": "Small dust, old Naira note, and cold air. Nothing again dey the pocket.",
"A bush lamp hanging on a nail. The glass is warm, but there is no kerosene in it at all.": "Bush lamp wey hang for nail. The glass warm, but kerosene no dey inside at all.",
"The ceiling fan turns and turns. NEPA took the light thirty years ago.": "The ceiling fan dey turn and turn. NEPA don take light since thirty years.",
"A bank calendar: October 1983. The 14th is circled so hard the biro went through the paper.": "Bank calendar: October 1983. Dem circle the 14th so hard, the biro tear the paper.",
"Locked. The keyhole is old iron. Outside, a generator that is not there is humming.": "E lock. The keyhole na old iron. Outside, generator wey no dey there dey hum.",
"The key grinds in the lock. The door yawns open on cold air.": "The key grind inside the lock. The door open wide, cold air enter.",
"Burglary-proof bars, rusted solid. For a moment a long grey hand presses flat against the glass. Then nothing.": "Burglary-proof, rust don hold am. For one moment, long grey hand press flat for the glass. Then nothing.",
"A cushion chair under lace covers. The cushion is dented. It is still warm.": "Cushion chair with lace cover. The cushion don sink. E still warm.",
"A big box television with a lace cover. It is not plugged in, but the screen is full of snow. For one moment there is a face in it.": "Big box television with lace for top. Dem no plug am, but snow full the screen. For one moment, face dey inside.",
"The painted eyes are closed now. She looks almost peaceful.": "The eyes for the painting don close now. She be like person wey don rest.",
"Mama, in a green gele. Her throat is bare: a dotted line where her coral beads should be. The eyes follow you.": "Mama, for green gele. Her neck empty: dotted line where her coral beads suppose dey. The eyes dey follow you.",
"You lay the beads against the painting and they stay there, as if they were painted on. Her eyes close. The frame swings out on a hidden hinge.": "You put the beads for the painting and dem stay there, like say dem paint am. Her eyes close. The frame swing open for hidden hinge.",
"A rusted iron key. Heavier than it should be.": "Iron key wey don rust. E heavy pass how e suppose be.",
"Stopped at twenty past seven. The pendulum hangs dead still.": "E stop for twenty past seven. The pendulum no dey move at all.",
"The drawer is open and the three dials sit slack.": "The drawer don open, the three dials just dey hang.",
"The drawer": "The drawer",
"Three brass dials. Flick each one to a number.": "Three brass dials. Flick each one go one number.",
"The dials click. The drawer slides out on its own. A string of coral beads lies inside.": "The dials click. The drawer slide comot by himself. Coral beads dey inside.",
"Red coral beads, the big kind for occasions. Cold as river water.": "Red coral beads, the big one for occasion. E cold like river water.",
"Plastic flowers, faded to the colour of old teeth. One of them is real, and dead.": "Plastic flowers, the colour don fade like old teeth. One of them na real flower, and e don die.",
"A man, a woman and a baby, Christmas 1982. Someone has scratched the man’s face away.": "Man, woman and baby, Christmas 1982. Somebody don scratch the man face comot.",
"Wedding plates nobody is allowed to eat from, glasses for visitors who never came. Behind them, something papery.": "Wedding plates wey nobody fit chop from, glass cups for visitors wey never come. Behind them, something like paper.",
"The little door": "The small door",
"Three symbols, in the right order.": "Three signs, for the correct arrangement.",
"The lock clicks. Behind the door a narrow servants’ stair winds down, toward the smell of old woodsmoke.": "The lock click. Behind the door, small stairs wey dey go down, where old firewood smoke dey smell.",
"Outside, a swing moves back and forth. There is no wind.": "Outside, swing dey move front and back. No breeze dey.",
"Moon, sun, star. They turn slowly, and keep turning when you stop looking.": "Moon, sun, star. Dem dey turn small-small, and dem no stop even when you no dey look.",
"A tin soldier salutes. Its painted face is wet.": "Tin soldier dey salute. Water dey him painted face.",
"The blocks spell H E L P. You nudge one and it straightens itself.": "The blocks spell H E L P. You push one and e straighten himself back.",
"The latch is rusted shut. From inside comes a small, patient knock.": "Rust don hold the latch. From inside, small knock dey come, patient.",
"The bear has both eyes now. Both of them look at you.": "The bear get two eyes now. The two of them dey look you.",
"One glass eye is missing. The other one watches you.": "One glass eye don miss. The other one dey watch you.",
"You sew the button on. The seam in its belly splits, and a small brass key clinks onto the shelf. You take it.": "You sew the button. The belly tear, and one small brass key drop for the shelf. You take am.",
"It rocks by itself. Something dark glints in its mane: a black button.": "E dey rock by himself. Something black dey shine for him hair: black button.",
"It rocks a little faster when you look away.": "E dey rock fast small when you no dey look am.",
"The mattress is dented, as if someone small was just lying here. It is colder than it should be.": "The mattress don sink, like say small pikin just sleep there. E cold pass how e suppose be.",
"The box is wound down. There is a keyhole in its back.": "The box don stop. Keyhole dey for the back.",
"Old newspaper and camphor balls. Nothing scratches now.": "Old newspaper and camphor balls. Nothing dey scratch again.",
"The scratching has stopped. Under the old newspaper, something small is folded.": "The scratching don stop. Under the old newspaper, something small dey folded.",
"From inside, a soft scratching. You open it anyway.": "From inside, soft scratching. You open am anyway.",
"An old gas cooker. When you turn a knob, a cylinder that should be empty hisses. A match might wake it.": "Old gas cooker. When you turn the knob, gas cylinder wey suppose empty dey hiss. Match fit wake am.",
"An old gas cooker, crusted with thirty years of soup.": "Old gas cooker, thirty years of soup don dry for body.",
"The blue flame throws a low, steady light across the room.": "The blue fire dey throw small light for the whole room.",
"The cooker is already burning.": "The cooker don already dey burn.",
"The burner catches with a soft whump and a ring of blue flame. Across the room, the jar labels come out of the dark.": "The burner catch with soft whump, ring of blue fire. Across the room, the jar labels show for the dark.",
"The kettle begins to scream.": "The kettle begin dey shout.",
"It shrieks and shrieks. The lid is rusted shut, and nothing comes out of the spout.": "E dey shout and shout. Rust don hold the cover, and nothing dey comot from the mouth.",
"Cold, and heavier than it should be. Something sloshes inside.": "E cold, and e heavy pass how e suppose be. Something dey shake inside.",
"An enamel pot swings on its hook with a clang. Inside the biggest one, a crust of afang soup, thirty-three years old. The others sway, as if someone just brushed past.": "One enamel pot swing for him hook, clang. Inside the biggest one, afang soup wey don dry for thirty-three years. The others dey shake, like say somebody just pass.",
"The long table is laid for six. A covered pot of edikang ikong sits in the middle, long gone to dust. Beside it, a household book lies open.": "Dem set the long table for six people. Covered pot of edikang ikong dey middle, e don turn dust. Near am, one house book dey open.",
"The chair at the head of the table was pushed in. Now it isn’t.": "Dem push the chair for the head of the table inside before. Now e no dey inside again.",
"The pantry stands open. A shelf of dead jars, and one hook.": "The pantry don open. Shelf of dead jars, and one hook.",
"The pantry door is latched from the inside, which should not be possible.": "Dem lock the pantry door from inside, and that one no suppose possible.",
"An iron key on a hook. It is warm, as if someone has only just let go of it.": "Iron key for hook. E warm, like say somebody just leave am now.",
"A low wooden door in the wall. The keyhole is small and clean, as if it had been waiting.": "Small wooden door for the wall. The keyhole small and clean, like say e dey wait.",
"The key turns. Beyond the door, concrete steps go down into the dark store room.": "The key turn. Behind the door, concrete stairs dey go down enter the dark store room.",
"Burglary-proof bars. In the compound, a tall bald figure in a raffia fringe stands under the mango tree, looking in. When you blink, it is only the clothes line.": "Burglary-proof. For the compound, one tall bald thing wey wear raffia dey stand under the mango tree, dey look inside. When you blink, na just the cloth line.",
"Nailed shut, board over board. The nails are new. Someone was very sure.": "Dem nail am shut, board on top board. The nails new. Somebody sure well-well.",
"A cutlass rests on the chopping board, its edge bright. Someone still keeps it sharp.": "Cutlass dey for the chopping board, the mouth dey shine. Somebody still dey sharpen am.",
"A mortar and pestle for pounding yam. The pestle is wet. Somewhere, very faint, someone is pounding: thump, thump, thump.": "Mortar and pestle for pound yam. The pestle wet. Somewhere far, somebody dey pound: thump, thump, thump.",
"An old bush lamp on a nail. There is still kerosene sloshing in the tank. You need a flame.": "Old bush lamp for nail. Kerosene still dey shake inside the tank. You need fire.",
"The wick catches behind the glass. The dark pulls back, but not far. You lift the bush lamp off its nail and carry it with you.": "The wick catch fire for inside the glass. The dark shift back small. You carry the bush lamp comot from the nail, you hold am.",
"The padlock hangs open.": "The padlock don open.",
"The padlock": "The padlock",
"Three numbers. The walls have been telling you.": "Three numbers. The walls don dey tell you.",
"The padlock drops open.": "The padlock open.",
"The brass key sits in the lock.": "The brass key dey inside the lock.",
"A keyhole as big as your thumb.": "Keyhole wey big reach your thumb.",
"The brass key turns with a groan.": "The brass key turn with groan.",
"One lock left: the big keyhole.": "One lock remain: the big keyhole.",
"One lock left: the padlock.": "One lock remain: the padlock.",
"Two locks hold it shut: a padlock and a big keyhole.": "Two locks hold am: padlock and big keyhole.",
"Under the old wrapper: a strip torn from it, stiff with kerosene. You take it.": "Under the old wrapper: one piece wey don tear, kerosene don stiff am. You take am.",
"Just an old wrapper now.": "Na just old wrapper now.",
"The lid shrieks open. A crowbar lies inside, as if it was waiting.": "The cover shout as e open. Crowbar dey inside, like say e dey wait.",
"An empty toolbox. Its lid is still creaking.": "Empty toolbox. The cover still dey creak.",
"A skull on the bench. Its jaw hangs open, mid-scream.": "Skull for the bench. Him mouth open, like say e dey shout.",
"Schnapps bottles for pouring libation, never opened. One label has been scratched to read: HER TEARS.": "Schnapps bottles for pour libation, dem never open am. Somebody scratch one label make e read: HER TEARS.",
"The coffin lies open. The skeletal hand is slack now.": "The coffin don open. The bone hand don loose now.",
"Nailed shut. Something inside shifts when you touch the lid.": "Dem nail am shut. Something inside shift when you touch the cover.",
"The nails shriek out of the wood. A skeletal hand clutches a brass key. You pry the fingers open, one by one.": "The nails shout as dem comot. Bone hand hold brass key. You open the fingers, one by one.",
"Something sloshes inside. It does not smell like palm wine.": "Something dey shake inside. E no smell like palm wine.",
"The hurricane lamp throws a pool of light across the desk.": "The hurricane lamp throw light for the whole desk.",
"A hurricane lamp. The wick is dry, but the tank still smells of kerosene. You need a flame.": "Hurricane lamp. The wick don dry, but the tank still dey smell kerosene. You need fire.",
"The lamp is already burning.": "The lamp don already dey burn.",
"The lamp catches. Somewhere in the room a record player crackles to life and starts an old highlife tune, far too slow.": "The lamp catch. Somewhere for the room, record player start to play old highlife, too slow.",
"A small framed photo. In this dark it is only a pale shape.": "Small photo frame. For this dark, na just white shape.",
"There is something brass on the front of the drawer. It is too dark to see what.": "Something brass dey for the front of the drawer. E too dark to see wetin e be.",
"The drawer lies open.": "The drawer don open.",
"Four brass letter wheels. A name, perhaps.": "Four brass letter wheels. Maybe na name.",

/* ---------- "if something calls your name, do not answer" ---------- */
const QUIET = { on: false };
function setQuietUi(on, frac = 1) {

  QUIET.on = true;
  if (!warnRoll()) { quietBegin(); return true; }   // no warning this time
  setTimeout(() => { if (QUIET.on && Rm && !G.over) quietBegin(); else QUIET.on = false; }, WARN_LEAD);
  return true;
}
const WARN_LEAD = 3400;   // ms between the first click and the voice: the voice comes on the clicker's last double click

/* ---------- the clicker: an unreliable warning ---------- */
/* Before Ojuju calls your name or walks into the room, the clicker sounds only some of the time (WARN_CHANCE).
   And now and then it clicks when nothing comes at all. Players learn to dread it, never to trust it. */
const WARN_CHANCE = .1;   // about one time in ten
const WARN_GAP = 180000;   // and never within three minutes of the last click
const WARN = { last: 0, falseT: 0 };
function warnRoll() {
  if (Date.now() - WARN.last < WARN_GAP || Math.random() >= WARN_CHANCE) return false;
  Snd.warn(); WARN.last = Date.now(); return true;
}
function falseWarnLoop() {
  clearTimeout(WARN.falseT);
  WARN.falseT = setTimeout(() => {
    const quiet = !(typeof PRES !== 'undefined' && PRES.on) && !(typeof NEPA !== 'undefined' && NEPA.on);
    if (Rm && G.started && !G.over && !G.paused && !G.busy && !modalOpen() && !document.hidden && canAct() && quiet &&
        !CH.on && !CH.hidden && !QUIET.on && roomKey() !== 'roof' && Date.now() - WARN.last > WARN_GAP && Math.random() < .1) {
      Snd.warn(); WARN.last = Date.now();
    }
    falseWarnLoop();
  }, (40 + Math.random() * 50) * 1000);
}
falseWarnLoop();
function quietBegin() {
  const gentle = G.mode === 'gentle', dur = gentle ? 3.2 : 4.6;
  const c = G.cam, x0 = c.pos[0], z0 = c.pos[2];
  if (typeof resetQuietText === 'function') resetQuietText();
  speak('o_effiong', { side: Math.random() < .5 ? -1 : 1 });
  setQuietUi(true, 1);
  let t = 0;
  fx.push(dt => {
    if (!QUIET.on || !Rm) return false;
    t += dt; setQuietUi(true, Math.max(0, 1 - t / dur));
    const moved = Math.hypot(c.pos[0] - x0, c.pos[2] - z0) > .15;
    if (moved && t > .3) {
      QUIET.on = false; setQuietUi(false);
      say('You moved. It heard you.', 2600);
      if (gentle) scare('shade'); else { scare('behind', { face: 'silas', kind: 'silas' }); addDread(12); }   // his face: a lantern burns out
      return false;
    }
    if (t >= dur) {
      QUIET.on = false; setQuietUi(false);
      say('The voice moves on down the corridor, calling someone else.', 3600); addDread(-6);
      return false;
    }
    return true;
  });
  return true;
}
let callT = 0;
function scheduleCall() {

/* ---------- the radio: tune through the static until a voice comes through ---------- */

const RADIO_STATIONS = [

function radioPuzzle(o) {
